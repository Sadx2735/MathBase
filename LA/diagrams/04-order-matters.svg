<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="109" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="20" y="50" width="410" height="300" rx="16" fill="none" stroke="#ced4da" stroke-width="2"/>
    <line x1="108.0" y1="280" x2="348.0" y2="280" stroke="#adb5bd" stroke-width="2"/>
    <path d="M338.1 284.8 L348.0 280 L338.1 275.2" stroke="#adb5bd" stroke-width="2" fill="none"/>
    <line x1="140" y1="296.0" x2="140" y2="80.0" stroke="#adb5bd" stroke-width="2"/>
    <path d="M144.8 89.9 L140 80.0 L135.2 89.9" stroke="#adb5bd" stroke-width="2" fill="none"/>
    <line x1="140" y1="280" x2="220" y2="280" stroke="#1e1e1e" stroke-width="3"/>
    <path d="M210.1 284.8 L220 280 L210.1 275.2" stroke="#1e1e1e" stroke-width="3" fill="none"/>
    <line x1="140" y1="280" x2="140" y2="200" stroke="#1971c2" stroke-width="3"/>
    <path d="M144.8 209.9 L140 200 L135.2 209.9" stroke="#1971c2" stroke-width="3" fill="none"/>
    <rect x="450" y="50" width="410" height="300" rx="16" fill="none" stroke="#ced4da" stroke-width="2"/>
    <line x1="538.0" y1="280" x2="778.0" y2="280" stroke="#adb5bd" stroke-width="2"/>
    <path d="M768.1 284.8 L778.0 280 L768.1 275.2" stroke="#adb5bd" stroke-width="2" fill="none"/>
    <line x1="570" y1="296.0" x2="570" y2="80.0" stroke="#adb5bd" stroke-width="2"/>
    <path d="M574.8 89.9 L570 80.0 L565.2 89.9" stroke="#adb5bd" stroke-width="2" fill="none"/>
    <line x1="570" y1="280" x2="650" y2="280" stroke="#1e1e1e" stroke-width="3"/>
    <path d="M640.1 284.8 L650 280 L640.1 275.2" stroke="#1e1e1e" stroke-width="3" fill="none"/>
    <line x1="570" y1="280" x2="730" y2="280" stroke="#f08c00" stroke-width="3"/>
    <path d="M720.1 284.8 L730 280 L720.1 275.2" stroke="#f08c00" stroke-width="3" fill="none"/>
    <line x1="570" y1="280" x2="570" y2="120" stroke="#e03131" stroke-width="3"/>
    <path d="M574.8 129.9 L570 120 L565.2 129.9" stroke="#e03131" stroke-width="3" fill="none"/>
  </g>

  <text class="t" x="20" y="30" font-size="19" >Order matters: S R ≠ R S  (S = stretch x by 2, R = rotate 90°)</text>
  <text class="t" x="40" y="80" font-size="16" style="fill:#1971c2">S R v : rotate first, then stretch</text>
  <text class="t" x="210" y="306" font-size="14" >v = (1,0)</text>
  <text class="t" x="40" y="338" font-size="13" style="fill:#868e96">after rotate: (0,1) · stretch keeps it: (0,1)</text>
  <text class="t" x="152" y="208" font-size="16" style="fill:#1971c2">result (0, 1)</text>
  <text class="t" x="470" y="80" font-size="16" style="fill:#e03131">R S v : stretch first, then rotate</text>
  <text class="t" x="640" y="306" font-size="14" >v = (1,0)</text>
  <text class="t" x="470" y="338" font-size="13" style="fill:#868e96">after stretch: (2,0) · then rotate: (0,2)</text>
  <text class="t" x="582" y="128" font-size="16" style="fill:#e03131">result (0, 2)</text>
  <text class="t" x="700" y="266" font-size="14" style="fill:#f08c00">(2,0)</text>
  <text class="t" x="20" y="395" font-size="17" >read right to left: in (S R) v, R touches v first.</text>
  <text class="t" x="500" y="395" font-size="17" style="fill:#9c36b5">A(BC) = (AB)C, but AB ≠ BA</text>
</svg>
