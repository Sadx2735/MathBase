<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="137" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="880" height="380" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="60" y1="110" x2="790" y2="110" stroke="#1e1e1e" stroke-width="2.5"/>
    <line x1="60" y1="280" x2="790" y2="280" stroke="#1e1e1e" stroke-width="2.5"/>
    <line x1="80" y1="118" x2="80.0" y2="272" stroke="#adb5bd" stroke-width="1.5"/>
    <circle cx="80" cy="110" r="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="80.0" cy="280" r="6" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="165" y1="118" x2="306.66666666666663" y2="272" stroke="#adb5bd" stroke-width="1.5"/>
    <circle cx="165" cy="110" r="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="306.66666666666663" cy="280" r="6" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="250" y1="118" x2="420.0" y2="272" stroke="#adb5bd" stroke-width="1.5"/>
    <circle cx="250" cy="110" r="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="420.0" cy="280" r="6" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="335" y1="118" x2="488.0" y2="272" stroke="#adb5bd" stroke-width="1.5"/>
    <circle cx="335" cy="110" r="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="488.0" cy="280" r="6" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="420" y1="118" x2="533.3333333333333" y2="272" stroke="#adb5bd" stroke-width="1.5"/>
    <circle cx="420" cy="110" r="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="533.3333333333333" cy="280" r="6" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="505" y1="118" x2="565.7142857142858" y2="272" stroke="#adb5bd" stroke-width="1.5"/>
    <circle cx="505" cy="110" r="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="565.7142857142858" cy="280" r="6" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="590" y1="118" x2="590.0" y2="272" stroke="#adb5bd" stroke-width="1.5"/>
    <circle cx="590" cy="110" r="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="590.0" cy="280" r="6" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="675" y1="118" x2="608.8888888888889" y2="272" stroke="#adb5bd" stroke-width="1.5"/>
    <circle cx="675" cy="110" r="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="608.8888888888889" cy="280" r="6" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="760" y1="118" x2="624.0" y2="272" stroke="#adb5bd" stroke-width="1.5"/>
    <circle cx="760" cy="110" r="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="624.0" cy="280" r="6" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="760" y1="240" x2="760" y2="320" stroke="#9c36b5" stroke-width="2.5" stroke-dasharray="6 5"/>
  </g>

  <text class="t" x="20" y="30" font-size="19" >Perspective: dividing by z̄ = 0.5x + 1 bunches far points together</text>
  <text class="t" x="80" y="92" font-size="14" text-anchor="middle" style="fill:#1971c2">0</text>
  <text class="t" x="165" y="92" font-size="14" text-anchor="middle" style="fill:#1971c2">1</text>
  <text class="t" x="250" y="92" font-size="14" text-anchor="middle" style="fill:#1971c2">2</text>
  <text class="t" x="335" y="92" font-size="14" text-anchor="middle" style="fill:#1971c2">3</text>
  <text class="t" x="420" y="92" font-size="14" text-anchor="middle" style="fill:#1971c2">4</text>
  <text class="t" x="505" y="92" font-size="14" text-anchor="middle" style="fill:#1971c2">5</text>
  <text class="t" x="590" y="92" font-size="14" text-anchor="middle" style="fill:#1971c2">6</text>
  <text class="t" x="675" y="92" font-size="14" text-anchor="middle" style="fill:#1971c2">7</text>
  <text class="t" x="760" y="92" font-size="14" text-anchor="middle" style="fill:#1971c2">8</text>
  <text class="t" x="760" y="345" font-size="15" text-anchor="middle" style="fill:#9c36b5">vanishing point x₂ = 2</text>
  <text class="t" x="80.0" y="305" font-size="13" text-anchor="middle" style="fill:#e03131">0</text>
  <text class="t" x="306.66666666666663" y="305" font-size="13" text-anchor="middle" style="fill:#e03131">0.67</text>
  <text class="t" x="420.0" y="305" font-size="13" text-anchor="middle" style="fill:#e03131">1</text>
  <text class="t" x="20" y="70" font-size="15" style="fill:#1971c2">before: evenly spaced x = 0 … 8</text>
  <text class="t" x="92" y="228.0" font-size="14" style="fill:#e03131">after H:</text>
  <text class="t" x="92" y="247.6" font-size="14" style="fill:#e03131">x₂ = x/(0.5x + 1)</text>
  <text class="t" x="20" y="345" font-size="14" style="fill:#868e96">x = 1 → ÷1.5, x = 2 → ÷2, x → ∞ gives x₂ → 2</text>
</svg>
