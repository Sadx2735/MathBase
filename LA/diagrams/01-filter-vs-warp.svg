<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="101" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="60" y="150" width="40" height="40" rx="0" fill="#74c0fc" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="100" y="150" width="40" height="40" rx="0" fill="#8ce99a" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="140" y="150" width="40" height="40" rx="0" fill="#ffd43b" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="60" y="190" width="40" height="40" rx="0" fill="#ff8787" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="100" y="190" width="40" height="40" rx="0" fill="#da77f2" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="140" y="190" width="40" height="40" rx="0" fill="#74c0fc" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="60" y="230" width="40" height="40" rx="0" fill="#ffd43b" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="100" y="230" width="40" height="40" rx="0" fill="#8ce99a" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="140" y="230" width="40" height="40" rx="0" fill="#ff8787" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="520" y="70" width="40" height="40" rx="0" fill="#d0ebff" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="560" y="70" width="40" height="40" rx="0" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="600" y="70" width="40" height="40" rx="0" fill="#fff3bf" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="520" y="110" width="40" height="40" rx="0" fill="#ffe3e3" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="560" y="110" width="40" height="40" rx="0" fill="#f3d9fa" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="600" y="110" width="40" height="40" rx="0" fill="#d0ebff" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="520" y="150" width="40" height="40" rx="0" fill="#fff3bf" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="560" y="150" width="40" height="40" rx="0" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="1.6"/>
    <rect x="600" y="150" width="40" height="40" rx="0" fill="#ffe3e3" stroke="#1e1e1e" stroke-width="1.6"/>
