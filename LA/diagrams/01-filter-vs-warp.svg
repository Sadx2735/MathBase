    <path d="M190 180 Q 343.2 125.5 505 110" stroke="#f08c00" stroke-width="2" fill="none"/>
    <path d="M495.6 115.7 L505 110 L494.7 106.2" stroke="#f08c00" stroke-width="2" fill="none"/>
    <path d="M190 230 Q 344.4 274.8 505 280" stroke="#9c36b5" stroke-width="2" fill="none"/>
    <path d="M494.9 284.5 L505 280 L495.3 274.9" stroke="#9c36b5" stroke-width="2" fill="none"/>
  </g>

  <text class="t" x="20" y="30" font-size="20" >Two ways to change an image f(x, y)</text>
  <text class="t" x="60" y="135" font-size="16" >original</text>
  <text class="t" x="250" y="100" font-size="18" style="fill:#f08c00">filtering</text>
  <text class="t" x="250" y="330" font-size="18" style="fill:#9c36b5">warping</text>
  <text class="t" x="670" y="85.0" font-size="15" style="fill:#f08c00">g = T( f(x, y) )</text>
  <text class="t" x="670" y="106.0" font-size="15" style="fill:#f08c00">VALUES change</text>
  <text class="t" x="670" y="127.0" font-size="15" style="fill:#f08c00">positions stay</text>
  <text class="t" x="670" y="148.0" font-size="15" style="fill:#f08c00">brightness, blur</text>
  <text class="t" x="715" y="255.0" font-size="14" style="fill:#9c36b5">g = f( T(x, y) )</text>
  <text class="t" x="715" y="274.6" font-size="14" style="fill:#9c36b5">POSITIONS change</text>
  <text class="t" x="715" y="294.2" font-size="14" style="fill:#9c36b5">values stay</text>
  <text class="t" x="715" y="313.8" font-size="14" style="fill:#9c36b5">scale, rotate</text>
  <text class="t" x="60" y="380" font-size="14" style="fill:#868e96">filtering: +50 brightness, nothing moves.  warping: pixel at (10, 20) shows at (20, 40), same colour.</text>
</svg>
