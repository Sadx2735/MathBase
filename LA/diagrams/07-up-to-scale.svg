<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="131" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="65.0" y1="380" x2="702.5" y2="380" stroke="#1e1e1e" stroke-width="2"/>
    <path d="M692.6 384.8 L702.5 380 L692.6 375.2" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <line x1="90" y1="395.0" x2="90" y2="72.5" stroke="#1e1e1e" stroke-width="2"/>
    <path d="M94.8 82.4 L90 72.5 L85.2 82.4" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <line x1="215" y1="387.5" x2="215" y2="95.0" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="8 6"/>
    <line x1="90" y1="380" x2="665.0" y2="173.00000000000003" stroke="#1971c2" stroke-width="3"/>
    <circle cx="340" cy="290.0" r="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="590" cy="200.0" r="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="215" cy="335.0" r="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <path d="M272 350 Q 242.6 358.6 220.0 338.0" stroke="#e03131" stroke-width="2" fill="none"/>
    <path d="M230.5 341.1 L220.0 338.0 L224.1 348.2" stroke="#e03131" stroke-width="2" fill="none"/>
    <line x1="90" y1="380" x2="390.0" y2="110.0" stroke="#adb5bd" stroke-width="2.5"/>
    <circle cx="215" cy="267.5" r="7" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
    <line x1="94" y1="380" x2="94" y2="102.5" stroke="#e03131" stroke-width="2.5" stroke-dasharray="3 6"/>
    <path d="M690 100 L682 100 L682 182 L690 182" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <path d="M814 100 L822 100 L822 182 L814 182" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <path d="M690 250 L682 250 L682 332 L690 332" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <path d="M814 250 L822 250 L822 332 L814 332" stroke="#1e1e1e" stroke-width="2" fill="none"/>
  </g>

  <text class="t" x="20" y="30" font-size="20" >Why h33 = 1 is allowed: one transformation = one ray of matrices</text>
  <text class="t" x="702.5" y="408" font-size="15" text-anchor="end">h33 (bottom-right entry)</text>
  <text class="t" x="102" y="62.0" font-size="13" style="fill:#868e96">the other 8 entries</text>
  <text class="t" x="102" y="80.2" font-size="13" style="fill:#868e96">(squashed onto one axis)</text>
  <text class="t" x="221" y="408" font-size="15" style="fill:#2f9e44">h33 = 1</text>
  <text class="t" x="586" y="186.0" font-size="15" text-anchor="end" style="fill:#1971c2">H (h33 = 4)</text>
  <text class="t" x="350" y="314.0" font-size="14" style="fill:#1971c2">H/2</text>
  <text class="t" x="277.5" y="355.75" font-size="16" style="fill:#e03131">H/4: the one copy with h33 = 1</text>
  <text class="t" x="398.0" y="114.0" font-size="13" style="fill:#868e96">another transformation</text>
  <text class="t" x="102" y="185.0" font-size="14" style="fill:#e03131">h33 = 0</text>
  <text class="t" x="718" y="362.0" font-size="14" style="fill:#e03131">h33 = 0 ray:</text>
  <text class="t" x="718" y="381.6" font-size="14" style="fill:#e03131">never hits h33 = 1 ✗</text>
  <text class="t" x="707.0" y="120" font-size="15" text-anchor="middle">2</text>
  <text class="t" x="753.0" y="120" font-size="15" text-anchor="middle">0</text>
  <text class="t" x="799.0" y="120" font-size="15" text-anchor="middle">0</text>
  <text class="t" x="707.0" y="146" font-size="15" text-anchor="middle">0</text>
  <text class="t" x="753.0" y="146" font-size="15" text-anchor="middle">2</text>
  <text class="t" x="799.0" y="146" font-size="15" text-anchor="middle">0</text>
  <text class="t" x="707.0" y="172" font-size="15" text-anchor="middle">1</text>
  <text class="t" x="753.0" y="172" font-size="15" text-anchor="middle">0</text>
  <text class="t" x="799.0" y="172" font-size="15" text-anchor="middle">4</text>
  <text class="t" x="682" y="90" font-size="14" style="fill:#1971c2">H</text>
  <text class="t" x="707.0" y="270" font-size="15" text-anchor="middle">0.5</text>
  <text class="t" x="753.0" y="270" font-size="15" text-anchor="middle">0</text>
  <text class="t" x="799.0" y="270" font-size="15" text-anchor="middle">0</text>
  <text class="t" x="707.0" y="296" font-size="15" text-anchor="middle">0</text>
  <text class="t" x="753.0" y="296" font-size="15" text-anchor="middle">0.5</text>
  <text class="t" x="799.0" y="296" font-size="15" text-anchor="middle">0</text>
  <text class="t" x="707.0" y="322" font-size="15" text-anchor="middle">0.25</text>
  <text class="t" x="753.0" y="322" font-size="15" text-anchor="middle">0</text>
  <text class="t" x="799.0" y="322" font-size="15" text-anchor="middle">1</text>
  <text class="t" x="682" y="240" font-size="14" style="fill:#e03131">H/4 (k = 1/4)</text>
  <text class="t" x="800" y="220" font-size="15" text-anchor="middle" style="fill:#868e96">× 1/4 ↓</text>
  <text class="t" x="20" y="445" font-size="15" >kH ≡ H: sliding along a ray changes nothing → keep only the dot on h33 = 1 → 9 − 1 = 8 numbers left</text>
  <text class="t" x="20" y="470" font-size="13" style="fill:#868e96">(one ray per transformation, each ray crosses the green line once → no repeats, nothing lost, except rays with h33 = 0)</text>
</svg>
