    <path d="M153 315 L161 315 L161 371 L153 371" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <rect x="235" y="50" width="200" height="250" rx="14" fill="none" stroke="#ced4da" stroke-width="2"/>
    <line x1="245" y1="250" x2="425" y2="250" stroke="#ced4da" stroke-width="1"/>
