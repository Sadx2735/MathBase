  <text class="t" x="20" y="30" font-size="20" >The four basic 2×2 warps (grey = before, colour = after)</text>
  <text class="t" x="120" y="76" font-size="17" text-anchor="middle" style="fill:#1971c2">scale</text>
  <text class="t" x="92.0" y="335" font-size="16" text-anchor="middle">2</text>
  <text class="t" x="138.0" y="335" font-size="16" text-anchor="middle">0</text>
  <text class="t" x="92.0" y="361" font-size="16" text-anchor="middle">0</text>
  <text class="t" x="138.0" y="361" font-size="16" text-anchor="middle">1</text>
  <text class="t" x="120" y="405" font-size="14" text-anchor="middle" style="fill:#868e96">det = 2</text>
  <text class="t" x="335" y="76" font-size="17" text-anchor="middle" style="fill:#2f9e44">rotate 90°</text>
  <text class="t" x="307.0" y="335" font-size="16" text-anchor="middle">0</text>
  <text class="t" x="353.0" y="335" font-size="16" text-anchor="middle">−1</text>
  <text class="t" x="307.0" y="361" font-size="16" text-anchor="middle">1</text>
  <text class="t" x="353.0" y="361" font-size="16" text-anchor="middle">0</text>
  <text class="t" x="335" y="405" font-size="14" text-anchor="middle" style="fill:#868e96">det = 1</text>
  <text class="t" x="550" y="76" font-size="17" text-anchor="middle" style="fill:#f08c00">shear</text>
  <text class="t" x="522.0" y="335" font-size="16" text-anchor="middle">1</text>
  <text class="t" x="568.0" y="335" font-size="16" text-anchor="middle">0.5</text>
  <text class="t" x="522.0" y="361" font-size="16" text-anchor="middle">0</text>
  <text class="t" x="568.0" y="361" font-size="16" text-anchor="middle">1</text>
  <text class="t" x="550" y="405" font-size="14" text-anchor="middle" style="fill:#868e96">det = 1</text>
  <text class="t" x="765" y="76" font-size="17" text-anchor="middle" style="fill:#e03131">mirror</text>
  <text class="t" x="737.0" y="335" font-size="16" text-anchor="middle">−1</text>
  <text class="t" x="783.0" y="335" font-size="16" text-anchor="middle">0</text>
  <text class="t" x="737.0" y="361" font-size="16" text-anchor="middle">0</text>
  <text class="t" x="783.0" y="361" font-size="16" text-anchor="middle">1</text>
  <text class="t" x="765" y="405" font-size="14" text-anchor="middle" style="fill:#e03131">det = −1 (flip!)</text>
</svg>
