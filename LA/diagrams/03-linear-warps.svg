    <rect x="20" y="50" width="200" height="250" rx="14" fill="none" stroke="#ced4da" stroke-width="2"/>
    <line x1="30" y1="250" x2="210" y2="250" stroke="#ced4da" stroke-width="1"/>
    <line x1="80" y1="95" x2="80" y2="290" stroke="#ced4da" stroke-width="1"/>
    <path d="M80.0 250.0 L80.0 178.0 L123.2 178.0 L123.2 192.4 L94.4 192.4 L94.4 206.8 L116.0 206.8 L116.0 221.2 L94.4 221.2 L94.4 250.0 Z" stroke="#adb5bd" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
