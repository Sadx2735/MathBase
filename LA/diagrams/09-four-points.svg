<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="139" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="880" height="380" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="30" y="60" width="330" height="260" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="2"/>
    <path d="M90.0 120.0 L290.0 90.0 L320.0 290.0 L70.0 260.0 Z" stroke="#1e1e1e" stroke-width="2.5" fill="#ffffff"/>
    <line x1="104.0" y1="162.0" x2="274.0" y2="150.0" stroke="#adb5bd" stroke-width="1.5"/>
    <line x1="100.0" y1="190.0" x2="280.0" y2="190.0" stroke="#adb5bd" stroke-width="1.5"/>
    <line x1="96.0" y1="218.0" x2="286.0" y2="230.0" stroke="#adb5bd" stroke-width="1.5"/>
    <path d="M560.0 80.0 L760.0 80.0 L760.0 300.0 L560.0 300.0 Z" stroke="#1e1e1e" stroke-width="2.5" fill="#ffffff"/>
    <line x1="580" y1="146.0" x2="735" y2="146.0" stroke="#adb5bd" stroke-width="1.5"/>
    <line x1="580" y1="190.0" x2="735" y2="190.0" stroke="#adb5bd" stroke-width="1.5"/>
    <line x1="580" y1="234.0" x2="735" y2="234.0" stroke="#adb5bd" stroke-width="1.5"/>
    <circle cx="90" cy="120" r="7" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <circle cx="560" cy="80" r="7" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <circle cx="290" cy="90" r="7" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="760" cy="80" r="7" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="320" cy="290" r="7" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
    <circle cx="760" cy="300" r="7" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
    <circle cx="70" cy="260" r="7" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
    <circle cx="560" cy="300" r="7" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
    <line x1="380" y1="190" x2="535" y2="190" stroke="#9c36b5" stroke-width="3"/>
    <path d="M525.1 194.8 L535 190 L525.1 185.2" stroke="#9c36b5" stroke-width="3" fill="none"/>
  </g>

  <text class="t" x="20" y="30" font-size="19" >4 point pairs → 8 equations → H (un-warp a photographed page)</text>
  <text class="t" x="72" y="112" font-size="16" style="fill:#e03131">A</text>
  <text class="t" x="540" y="72" font-size="16" style="fill:#e03131">A′</text>
  <text class="t" x="302" y="82" font-size="16" style="fill:#1971c2">B</text>
  <text class="t" x="772" y="72" font-size="16" style="fill:#1971c2">B′</text>
  <text class="t" x="332" y="312" font-size="16" style="fill:#2f9e44">C</text>
  <text class="t" x="772" y="322" font-size="16" style="fill:#2f9e44">C′</text>
  <text class="t" x="52" y="282" font-size="16" style="fill:#f08c00">D</text>
  <text class="t" x="540" y="322" font-size="16" style="fill:#f08c00">D′</text>
  <text class="t" x="457" y="175" font-size="22" text-anchor="middle" style="fill:#9c36b5">H</text>
  <text class="t" x="195" y="345" font-size="15" text-anchor="middle" style="fill:#868e96">photo: tilted page</text>
  <text class="t" x="660" y="345" font-size="15" text-anchor="middle" style="fill:#868e96">flat A4 page</text>
  <text class="t" x="20" y="372" font-size="14" >each pair (x, y) → (x₂, y₂) gives 2 equations · 8 unknowns (h33 = 1) · so 4 pairs, more → least squares</text>
</svg>
