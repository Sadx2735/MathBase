<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="103" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="110" y1="342.0" x2="110" y2="77.99999999999997" stroke="#ced4da" stroke-width="1"/>
    <line x1="220" y1="342.0" x2="220" y2="77.99999999999997" stroke="#ced4da" stroke-width="1"/>
    <line x1="330" y1="342.0" x2="330" y2="77.99999999999997" stroke="#ced4da" stroke-width="1"/>
    <line x1="440" y1="342.0" x2="440" y2="77.99999999999997" stroke="#ced4da" stroke-width="1"/>
    <line x1="77.0" y1="320" x2="473.0" y2="320" stroke="#ced4da" stroke-width="1"/>
    <line x1="77.0" y1="210" x2="473.0" y2="210" stroke="#ced4da" stroke-width="1"/>
    <line x1="77.0" y1="100" x2="473.0" y2="100" stroke="#ced4da" stroke-width="1"/>
    <line x1="77.0" y1="320" x2="484.0" y2="320" stroke="#1e1e1e" stroke-width="2"/>
    <path d="M474.1 324.8 L484.0 320 L474.1 315.2" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <line x1="110" y1="347.5" x2="110" y2="56.0" stroke="#1e1e1e" stroke-width="2"/>
    <path d="M114.8 65.9 L110 56.0 L105.2 65.9" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <path d="M110.0 320.0 L220.0 320.0 L220.0 210.0 L110.0 210.0 Z" stroke="#adb5bd" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
    <path d="M110.0 320.0 L330.0 320.0 L385.0 210.0 L165.0 210.0 Z" stroke="#1971c2" stroke-width="2" fill="#a5d8ff" fill-opacity="0.55"/>
    <line x1="110" y1="320" x2="330" y2="320" stroke="#e03131" stroke-width="3"/>
    <path d="M320.1 324.8 L330 320 L320.1 315.2" stroke="#e03131" stroke-width="3" fill="none"/>
    <line x1="110" y1="320" x2="165.0" y2="210" stroke="#2f9e44" stroke-width="3"/>
    <path d="M164.8 221.0 L165.0 210 L156.3 216.7" stroke="#2f9e44" stroke-width="3" fill="none"/>
    <circle cx="220" cy="210" r="6" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/>
    <circle cx="385.0" cy="210" r="7" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
    <path d="M230 198 Q 301.5 180.0 373.0 198" stroke="#9c36b5" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
    <path d="M362.2 200.2 L373.0 198 L364.6 190.9" stroke="#9c36b5" stroke-width="2" fill="none"/>
    <path d="M186 122 Q 158.5 157.4 159.5 202.3" stroke="#2f9e44" stroke-width="2" fill="none"/>
    <path d="M154.5 192.5 L159.5 202.3 L164.1 192.3" stroke="#2f9e44" stroke-width="2" fill="none"/>
    <path d="M600 82 L592 82 L592 154 L600 154" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <path d="M706 82 L714 82 L714 154 L706 154" stroke="#1e1e1e" stroke-width="2" fill="none"/>
  </g>

  <text class="t" x="20" y="30" font-size="20" >A 2×2 matrix is decided by where (1,0) and (0,1) land</text>
  <text class="t" x="242.0" y="348" font-size="15" style="fill:#e03131">(1,0) → (2, 0)</text>
  <text class="t" x="192.5" y="127.5" font-size="16" style="fill:#2f9e44">(0,1) → (0.5, 1)</text>
  <text class="t" x="397.0" y="232" font-size="15" style="fill:#9c36b5">(1,1) → (2.5, 1)</text>
  <text class="t" x="624.0" y="110" font-size="20" text-anchor="middle" style="fill:#e03131">2</text>
  <text class="t" x="684.0" y="110" font-size="20" text-anchor="middle" style="fill:#2f9e44">0.5</text>
  <text class="t" x="624.0" y="144" font-size="20" text-anchor="middle" style="fill:#e03131">0</text>
  <text class="t" x="684.0" y="144" font-size="20" text-anchor="middle" style="fill:#2f9e44">1</text>
  <text class="t" x="592" y="72" font-size="14" style="fill:#868e96">M =</text>
  <text class="t" x="560" y="210.0" font-size="15" >red column = where (1,0) lands</text>
  <text class="t" x="560" y="231.0" font-size="15" >green column = where (0,1) lands</text>
  <text class="t" x="560" y="270.0" font-size="15" style="fill:#9c36b5">(1,1) = 1·(1,0) + 1·(0,1)</text>
  <text class="t" x="560" y="291.0" font-size="15" style="fill:#9c36b5">→ 1·col1 + 1·col2 = (2.5, 1)</text>
  <text class="t" x="560" y="340" font-size="13" style="fill:#868e96">grey dashed = before, blue = after</text>
</svg>
