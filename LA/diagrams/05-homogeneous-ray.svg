<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="113" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="920" height="420" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="68.0" y1="360" x2="706.0" y2="360" stroke="#1e1e1e" stroke-width="2"/>
    <path d="M696.1 364.8 L706.0 360 L696.1 355.2" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <line x1="90" y1="376.5" x2="90" y2="41.0" stroke="#1e1e1e" stroke-width="2"/>
    <path d="M94.8 50.9 L90 41.0 L85.2 50.9" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <line x1="79.0" y1="250" x2="695.0" y2="250" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="8 6"/>
    <line x1="90" y1="360" x2="684.0" y2="63.0" stroke="#1971c2" stroke-width="3"/>
    <line x1="90" y1="360" x2="299.0" y2="63.0" stroke="#adb5bd" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="200" cy="305.0" r="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="310" cy="250" r="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <circle cx="530" cy="140" r="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  </g>

  <text class="t" x="20" y="30" font-size="20" >Homogeneous coordinates: a 2D point is a whole ray</text>
  <text class="t" x="702.0" y="386" font-size="18" text-anchor="end">x̄</text>
  <text class="t" x="100" y="45.0" font-size="18" >z̄</text>
  <text class="t" x="900" y="274" font-size="14" text-anchor="end" style="fill:#2f9e44">z̄ = 1 (the real image plane)</text>
  <text class="t" x="212" y="331.0" font-size="15" style="fill:#1971c2">(1, 2, 0.5)</text>
  <text class="t" x="322" y="234" font-size="15" style="fill:#e03131">(2, 4, 1)</text>
  <text class="t" x="542" y="124" font-size="15" style="fill:#1971c2">(4, 8, 2)</text>
  <text class="t" x="256.0" y="74.0" font-size="13" text-anchor="end" style="fill:#868e96">another point = another ray</text>
  <text class="t" x="690" y="160.0" font-size="15" style="fill:#e03131">all three 3-vectors are</text>
  <text class="t" x="690" y="181.0" font-size="15" style="fill:#e03131">the SAME 2D point (2, 4)</text>
  <text class="t" x="690" y="208.0" font-size="14" >divide by z̄ = slide along</text>
  <text class="t" x="690" y="227.6" font-size="14" >the ray until z̄ = 1</text>
  <text class="t" x="690" y="300" font-size="13" style="fill:#868e96">(ȳ not drawn: 2D slice)</text>
</svg>
