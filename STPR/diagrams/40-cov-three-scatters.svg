  <text class="t" x="20" y="32" font-size="20" >Same x (age), three different partners: the sign of the covariance</text>
  <text class="t" x="157" y="78" font-size="16" text-anchor="middle">age vs height (in)</text>
  <text class="t" x="165.0" y="324" font-size="13" text-anchor="middle" style="fill:#868e96">age 6 → 10</text>
  <text class="t" x="157" y="352" font-size="19" text-anchor="middle" style="fill:#2f9e44">cov = +3.6</text>
  <text class="t" x="449" y="78" font-size="16" text-anchor="middle">age vs test grade</text>
  <text class="t" x="457.0" y="324" font-size="13" text-anchor="middle" style="fill:#868e96">age 6 → 10</text>
  <text class="t" x="449" y="352" font-size="19" text-anchor="middle" style="fill:#868e96">cov = 0</text>
  <text class="t" x="741" y="78" font-size="16" text-anchor="middle">age vs naps per day</text>
  <text class="t" x="749.0" y="324" font-size="13" text-anchor="middle" style="fill:#868e96">age 6 → 10</text>
  <text class="t" x="741" y="352" font-size="19" text-anchor="middle" style="fill:#e03131">cov = −1.2</text>
  <text class="t" x="20" y="405" font-size="15" style="fill:#868e96">dashed lines = the means; what matters is which side of BOTH means each point falls</text>
</svg>
