<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="147" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="900" height="450" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="40" y="122" width="830" height="40" rx="6" fill="#e9ecef" stroke="none" stroke-width="2"/>
    <rect x="40" y="166" width="830" height="40" rx="6" fill="none" stroke="none" stroke-width="2"/>
    <rect x="40" y="210" width="830" height="40" rx="6" fill="#e9ecef" stroke="none" stroke-width="2"/>
    <rect x="40" y="254" width="830" height="40" rx="6" fill="none" stroke="none" stroke-width="2"/>
    <line x1="40" y1="330" x2="870" y2="330" stroke="#1e1e1e" stroke-width="2"/>
  </g>

  <text class="t" x="20" y="32" font-size="20" >Why divide by n − 1? Try every sample of size 2 from {0, 4}</text>
  <text class="t" x="20" y="66" font-size="15" style="fill:#868e96">true variance σ² = 4  (values 0 and 4, mean 2, each 2 away → 2² = 4)</text>
  <text class="t" x="60" y="110" font-size="16" style="fill:#1e1e1e">sample</text>
  <text class="t" x="210" y="110" font-size="16" style="fill:#1e1e1e">x̄</text>
  <text class="t" x="330" y="110" font-size="16" style="fill:#1e1e1e">squared gaps from x̄</text>
  <text class="t" x="560" y="110" font-size="16" style="fill:#e03131">÷ n (= 2)</text>
  <text class="t" x="720" y="110" font-size="16" style="fill:#2f9e44">÷ (n − 1) (= 1)</text>
  <text class="t" x="70" y="150" font-size="17" >0, 0</text>
  <text class="t" x="220" y="150" font-size="17" >0</text>
  <text class="t" x="340" y="150" font-size="17" >0 + 0 = 0</text>
  <text class="t" x="570" y="150" font-size="17" >0</text>
  <text class="t" x="730" y="150" font-size="17" >0</text>
  <text class="t" x="70" y="194" font-size="17" >0, 4</text>
  <text class="t" x="220" y="194" font-size="17" >2</text>
  <text class="t" x="340" y="194" font-size="17" >4 + 4 = 8</text>
  <text class="t" x="570" y="194" font-size="17" >4</text>
  <text class="t" x="730" y="194" font-size="17" >8</text>
  <text class="t" x="70" y="238" font-size="17" >4, 0</text>
  <text class="t" x="220" y="238" font-size="17" >2</text>
  <text class="t" x="340" y="238" font-size="17" >4 + 4 = 8</text>
  <text class="t" x="570" y="238" font-size="17" >4</text>
  <text class="t" x="730" y="238" font-size="17" >8</text>
  <text class="t" x="70" y="282" font-size="17" >4, 4</text>
  <text class="t" x="220" y="282" font-size="17" >4</text>
  <text class="t" x="340" y="282" font-size="17" >0 + 0 = 0</text>
  <text class="t" x="570" y="282" font-size="17" >0</text>
  <text class="t" x="730" y="282" font-size="17" >0</text>
  <text class="t" x="330" y="360" font-size="16" >average over all 4 samples:</text>
  <text class="t" x="570" y="360" font-size="22" style="fill:#e03131">2</text>
  <text class="t" x="730" y="360" font-size="22" style="fill:#2f9e44">4 ✓</text>
  <text class="t" x="570" y="390" font-size="14" style="fill:#e03131">too small</text>
  <text class="t" x="730" y="390" font-size="14" style="fill:#2f9e44">matches σ²</text>
  <text class="t" x="20" y="432" font-size="15" style="fill:#868e96">x̄ sits in the middle of its own sample, so gaps from x̄ are a bit too small. n − 1 fixes that.</text>
</svg>
