  <text class="t" x="20" y="30" font-size="20" >What aX + b does to a distribution</text>
  <text class="t" x="60" y="343" font-size="13" text-anchor="middle">-2</text>
  <text class="t" x="164" y="343" font-size="13" text-anchor="middle">0</text>
  <text class="t" x="268" y="343" font-size="13" text-anchor="middle">2</text>
  <text class="t" x="372" y="343" font-size="13" text-anchor="middle">4</text>
  <text class="t" x="476" y="343" font-size="13" text-anchor="middle">6</text>
  <text class="t" x="580" y="343" font-size="13" text-anchor="middle">8</text>
  <text class="t" x="684" y="343" font-size="13" text-anchor="middle">10</text>
  <text class="t" x="788" y="343" font-size="13" text-anchor="middle">12</text>
  <text class="t" x="80" y="95" font-size="16" style="fill:#1971c2">X: mean 2, SD 1</text>
  <text class="t" x="480" y="70" font-size="16" style="fill:#2f9e44">X + 3: mean 5, SD 1</text>
  <text class="t" x="480" y="92" font-size="13" style="fill:#868e96">(slides over, same shape)</text>
  <text class="t" x="640" y="190" font-size="16" style="fill:#f08c00">2X: mean 4, SD 2</text>
  <text class="t" x="640" y="212" font-size="13" style="fill:#868e96">(stretched → Var × 4)</text>
  <text class="t" x="40" y="380" font-size="17" >E[aX + b] = a·E[X] + b</text>
  <text class="t" x="330" y="380" font-size="17" >Var(aX + b) = a²·Var(X)</text>
  <text class="t" x="620" y="380" font-size="17" >SD(aX + b) = |a|·SD(X)</text>
  <text class="t" x="40" y="410" font-size="14" style="fill:#868e96">adding a constant moves the centre but not the spread; multiplying stretches both</text>
</svg>
