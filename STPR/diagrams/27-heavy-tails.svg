  <text class="t" x="20" y="30" font-size="20" >Where kurtosis matters: same SD, fatter tails</text>
  <text class="t" x="91.0" y="353" font-size="13" text-anchor="middle">-4σ</text>
  <text class="t" x="153.0" y="353" font-size="13" text-anchor="middle">-3σ</text>
  <text class="t" x="215.0" y="353" font-size="13" text-anchor="middle">-2σ</text>
  <text class="t" x="277.0" y="353" font-size="13" text-anchor="middle">-1σ</text>
  <text class="t" x="339.0" y="353" font-size="13" text-anchor="middle">0</text>
  <text class="t" x="401.0" y="353" font-size="13" text-anchor="middle">+1σ</text>
  <text class="t" x="463.0" y="353" font-size="13" text-anchor="middle">+2σ</text>
  <text class="t" x="525.0" y="353" font-size="13" text-anchor="middle">+3σ</text>
  <text class="t" x="587.0" y="353" font-size="13" text-anchor="middle">+4σ</text>
  <text class="t" x="420" y="130" font-size="16" style="fill:#1971c2">normal: kurtosis 3</text>
  <text class="t" x="40" y="80" font-size="16" style="fill:#f08c00">fat-tailed: kurtosis 6</text>
  <text class="t" x="470" y="250" font-size="16" style="fill:#e03131">tails beyond 3σ</text>
  <text class="t" x="660" y="110.0" font-size="16" >P(beyond ±3σ)</text>
  <text class="t" x="660" y="132.4" font-size="16" >normal: 0.27%</text>
  <text class="t" x="660" y="154.8" font-size="16" >fat-tailed: 1.4%</text>
  <text class="t" x="660" y="177.2" font-size="16" >≈ 5× more often</text>
  <text class="t" x="660" y="240.0" font-size="14" style="fill:#868e96">used for:</text>
  <text class="t" x="660" y="259.6" font-size="14" style="fill:#868e96">· stock-market crashes</text>
  <text class="t" x="660" y="279.2" font-size="14" style="fill:#868e96">· insurance claims</text>
  <text class="t" x="660" y="298.8" font-size="14" style="fill:#868e96">· server latency spikes</text>
  <text class="t" x="20" y="395" font-size="15" style="fill:#9c36b5">a model that assumes 'normal' will badly underestimate rare disasters when the real kurtosis is high</text>
</svg>
