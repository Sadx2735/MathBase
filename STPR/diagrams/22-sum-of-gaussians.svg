  <text class="t" x="20" y="30" font-size="20" >Trip time R = T (train) + L (walk), independent</text>
  <text class="t" x="40" y="343" font-size="13" text-anchor="middle">0</text>
  <text class="t" x="150" y="343" font-size="13" text-anchor="middle">10</text>
  <text class="t" x="260" y="343" font-size="13" text-anchor="middle">20</text>
  <text class="t" x="370" y="343" font-size="13" text-anchor="middle">30</text>
  <text class="t" x="480" y="343" font-size="13" text-anchor="middle">40</text>
  <text class="t" x="590" y="343" font-size="13" text-anchor="middle">50</text>
  <text class="t" x="700" y="343" font-size="13" text-anchor="middle">60</text>
  <text class="t" x="810" y="343" font-size="13" text-anchor="middle">70</text>
  <text class="t" x="800" y="362" font-size="14" text-anchor="end">minutes</text>
  <text class="t" x="150" y="100" font-size="16" text-anchor="middle" style="fill:#2f9e44">L ~ N(10, 3²)</text>
  <text class="t" x="360" y="165" font-size="16" text-anchor="middle" style="fill:#1971c2">T ~ N(30, 4²)</text>
  <text class="t" x="470" y="140" font-size="16" style="fill:#e03131">R ~ N(40, 5²)</text>
  <text class="t" x="710" y="192" font-size="14" text-anchor="middle" style="fill:#1971c2">σ_T = 4</text>
  <text class="t" x="768" y="138" font-size="14" style="fill:#2f9e44">σ_L = 3</text>
  <text class="t" x="690" y="118" font-size="14" text-anchor="end" style="fill:#e03131">σ_R = 5</text>
  <text class="t" x="640" y="70" font-size="15" style="fill:#9c36b5">SDs add like Pythagoras</text>
  <text class="t" x="40" y="385" font-size="17" style="fill:#2f9e44">means add: 30 + 10 = 40</text>
  <text class="t" x="320" y="385" font-size="17" style="fill:#1971c2">variances add: 16 + 9 = 25</text>
  <text class="t" x="620" y="385" font-size="17" style="fill:#e03131">SDs don't: 4 + 3 ≠ 5</text>
  <text class="t" x="40" y="418" font-size="14" style="fill:#868e96">sum of independent normals is still normal, so R ~ N(40, 5²) and P(R &gt; 50) = P(Z &gt; 2) ≈ 2.3%</text>
</svg>
