  <text class="t" x="20" y="32" font-size="20" >More complex model → smaller training error, but wilder curve</text>
  <text class="t" x="122" y="76" font-size="15" text-anchor="middle" style="fill:#f08c00">straight line</text>
  <text class="t" x="122" y="330" font-size="13" text-anchor="middle">training MSE = 0.258</text>
  <text class="t" x="122" y="355" font-size="13" text-anchor="middle" style="fill:#868e96">largest weight ≈ 1</text>
  <text class="t" x="340" y="76" font-size="15" text-anchor="middle" style="fill:#2f9e44">degree 3</text>
  <text class="t" x="340" y="330" font-size="13" text-anchor="middle">training MSE = 0.023</text>
  <text class="t" x="340" y="355" font-size="13" text-anchor="middle" style="fill:#868e96">largest weight ≈ 3</text>
  <text class="t" x="558" y="76" font-size="15" text-anchor="middle" style="fill:#e03131">degree 9</text>
  <text class="t" x="558" y="330" font-size="13" text-anchor="middle">training MSE = 0.000</text>
  <text class="t" x="558" y="355" font-size="13" text-anchor="middle" style="fill:#868e96">largest weight ≈ 286</text>
  <text class="t" x="776" y="76" font-size="15" text-anchor="middle" style="fill:#9c36b5">degree 9 + penalty</text>
  <text class="t" x="776" y="330" font-size="13" text-anchor="middle">training MSE = 0.030</text>
  <text class="t" x="776" y="355" font-size="13" text-anchor="middle" style="fill:#868e96">largest weight ≈ 2</text>
  <text class="t" x="20" y="418" font-size="16" >degree 9 hits every training point but swings wildly in between → it learned the noise</text>
  <text class="t" x="20" y="448" font-size="15" style="fill:#868e96">loss = MSE + λ·(sum of weights²): big weights cost extra, so the curve calms down</text>
</svg>
