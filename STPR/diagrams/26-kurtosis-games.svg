<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="107" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="900" height="450" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="30" y="50" width="400" height="260" rx="16" fill="none" stroke="#ced4da" stroke-width="2"/>
    <line x1="45" y1="270" x2="415" y2="270" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="60" y1="265" x2="60" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="145" y1="265" x2="145" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="230" y1="265" x2="230" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="315" y1="265" x2="315" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="400" y1="265" x2="400" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="206.0" y="120.0" width="14" height="150.0" rx="1" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <rect x="240.0" y="120.0" width="14" height="150.0" rx="1" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <rect x="470" y="50" width="400" height="260" rx="16" fill="none" stroke="#ced4da" stroke-width="2"/>
    <line x1="485" y1="270" x2="855" y2="270" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="500" y1="265" x2="500" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="585" y1="265" x2="585" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="670" y1="265" x2="670" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="755" y1="265" x2="755" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="840" y1="265" x2="840" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="660.8" y="121.48514851485149" width="7" height="148.5148514851485" rx="1" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
    <rect x="672.2" y="121.48514851485149" width="7" height="148.5148514851485" rx="1" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
    <rect x="493.0" y="263" width="14" height="7" rx="1" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
    <rect x="833.0" y="263" width="14" height="7" rx="1" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
    <path d="M484 130 Q 503.9 192.5 500 258" stroke="#e03131" stroke-width="2" fill="none"/>
    <path d="M495.8 247.8 L500 258 L505.4 248.4" stroke="#e03131" stroke-width="2" fill="none"/>
    <path d="M830 130 Q 823.0 194.9 840 258" stroke="#e03131" stroke-width="2" fill="none"/>
    <path d="M832.8 249.7 L840 258 L842.0 247.2" stroke="#e03131" stroke-width="2" fill="none"/>
  </g>

  <text class="t" x="20" y="30" font-size="20" >Same mean, variance and skew, very different tails</text>
  <text class="t" x="230" y="78" font-size="17" text-anchor="middle" style="fill:#1971c2">Game 1: ±$1, 50/50</text>
  <text class="t" x="60" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">-10</text>
  <text class="t" x="145" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">-5</text>
  <text class="t" x="230" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">0</text>
  <text class="t" x="315" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">+5</text>
  <text class="t" x="400" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">+10</text>
  <text class="t" x="199" y="136.0" font-size="14" text-anchor="end" style="fill:#1971c2">50%</text>
  <text class="t" x="261" y="136.0" font-size="14" text-anchor="start" style="fill:#1971c2">50%</text>
  <text class="t" x="670" y="78" font-size="17" text-anchor="middle" style="fill:#f08c00">Game 2: ±10¢ mostly, ±$10 rarely</text>
  <text class="t" x="500" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">-10</text>
  <text class="t" x="585" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">-5</text>
  <text class="t" x="670" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">0</text>
  <text class="t" x="755" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">+5</text>
  <text class="t" x="840" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">+10</text>
  <text class="t" x="670" y="110" font-size="14" text-anchor="middle" style="fill:#f08c00">≈ 99.5% here (±10¢)</text>
  <text class="t" x="490" y="135" font-size="14" style="fill:#e03131">0.5%: −$10</text>
  <text class="t" x="740" y="135" font-size="14" style="fill:#e03131">0.5%: +$10</text>
  <text class="t" x="40" y="340" font-size="15" style="fill:#868e96"></text>
  <text class="t" x="260" y="340" font-size="15" style="fill:#868e96">Game 1</text>
  <text class="t" x="380" y="340" font-size="15" style="fill:#868e96">Game 2</text>
  <text class="t" x="40" y="362" font-size="15" style="fill:#1e1e1e">mean (1st)</text>
  <text class="t" x="260" y="362" font-size="15" style="fill:#1e1e1e">0</text>
  <text class="t" x="380" y="362" font-size="15" style="fill:#1e1e1e">0</text>
  <text class="t" x="40" y="384" font-size="15" style="fill:#1e1e1e">variance (2nd)</text>
  <text class="t" x="260" y="384" font-size="15" style="fill:#1e1e1e">1</text>
  <text class="t" x="380" y="384" font-size="15" style="fill:#1e1e1e">1</text>
  <text class="t" x="40" y="406" font-size="15" style="fill:#1e1e1e">skew (3rd)</text>
  <text class="t" x="260" y="406" font-size="15" style="fill:#1e1e1e">0</text>
  <text class="t" x="380" y="406" font-size="15" style="fill:#1e1e1e">0</text>
  <text class="t" x="40" y="428" font-size="15" style="fill:#1e1e1e">kurtosis (4th)</text>
  <text class="t" x="260" y="428" font-size="15" style="fill:#1e1e1e">1</text>
  <text class="t" x="380" y="428" font-size="15" style="fill:#e03131">≈ 99</text>
  <text class="t" x="500" y="345.0" font-size="15" style="fill:#9c36b5">4th power makes a $10 deviation count</text>
  <text class="t" x="500" y="366.0" font-size="15" style="fill:#9c36b5">10⁴ = 10,000 times a $1 deviation:</text>
  <text class="t" x="500" y="387.0" font-size="15" style="fill:#9c36b5">kurtosis spots rare, extreme outcomes</text>
</svg>
