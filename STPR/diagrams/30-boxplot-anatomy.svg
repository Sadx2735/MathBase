  <text class="t" x="20" y="30" font-size="20" >Anatomy of a box plot</text>
  <text class="t" x="60" y="60" font-size="14" style="fill:#868e96">data (sorted):</text>
  <text class="t" x="60" y="342" font-size="13" text-anchor="middle" style="fill:#868e96">-4</text>
  <text class="t" x="148" y="342" font-size="13" text-anchor="middle" style="fill:#868e96">0</text>
  <text class="t" x="236" y="342" font-size="13" text-anchor="middle" style="fill:#868e96">4</text>
