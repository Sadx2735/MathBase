  <text class="t" x="852" y="342" font-size="13" text-anchor="middle" style="fill:#868e96">32</text>
  <text class="t" x="269.0" y="160" font-size="14" text-anchor="end" style="fill:#1971c2">Q1 = 5.5</text>
  <text class="t" x="324" y="160" font-size="14" text-anchor="middle" style="fill:#9c36b5">median 8</text>
  <text class="t" x="379.0" y="160" font-size="14" style="fill:#1971c2">Q3 = 10.5</text>
  <text class="t" x="104.0" y="142" font-size="14" text-anchor="middle" style="fill:#e03131">fence −2</text>
  <text class="t" x="544.0" y="142" font-size="14" text-anchor="middle" style="fill:#e03131">fence 18</text>
  <text class="t" x="66.6" y="288" font-size="14" style="fill:#1e1e1e">whisker: to 2</text>
  <text class="t" x="456" y="288" font-size="14" style="fill:#1e1e1e">whisker: to 13</text>
  <text class="t" x="808" y="240" font-size="14" text-anchor="middle" style="fill:#e03131">outlier 30</text>
  <text class="t" x="324" y="270" font-size="14" text-anchor="middle" style="fill:#1971c2">box = middle 50%, IQR = 5</text>
  <text class="t" x="20" y="385" font-size="15" >fences: Q1 − 1.5·IQR = −2 and Q3 + 1.5·IQR = 18  ·  whiskers stop at the last REAL point inside them</text>
  <text class="t" x="20" y="415" font-size="14" style="fill:#868e96">5-number summary: min 2 · Q1 5.5 · median 8 · Q3 10.5 · max 30 (outlier drawn as its own dot)</text>
