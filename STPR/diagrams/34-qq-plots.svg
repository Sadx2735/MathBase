  <text class="t" x="20" y="30" font-size="20" >Q–Q plot: sorted data vs where a normal says they should be</text>
  <text class="t" x="160" y="76" font-size="16" text-anchor="middle" style="fill:#2f9e44">normal data</text>
  <text class="t" x="160" y="340" font-size="14" text-anchor="middle" style="fill:#2f9e44">on the line ✓</text>
  <text class="t" x="450" y="76" font-size="16" text-anchor="middle" style="fill:#e03131">right-skewed data</text>
  <text class="t" x="450" y="340" font-size="14" text-anchor="middle" style="fill:#e03131">bends up at the right</text>
  <text class="t" x="740" y="76" font-size="16" text-anchor="middle" style="fill:#f08c00">fat-tailed data</text>
  <text class="t" x="740" y="340" font-size="14" text-anchor="middle" style="fill:#f08c00">S-shape: both ends escape</text>
  <text class="t" x="20" y="385" font-size="15" >x-axis: normal quantiles Φ⁻¹((i − 0.5)/n)  ·  y-axis: the i-th smallest STANDARDISED data value</text>
  <text class="t" x="20" y="415" font-size="14" style="fill:#868e96">standardise first so a perfect normal sits on y = x (unstandardised: still a straight line, slope σ, intercept μ)</text>
