  <text class="t" x="20" y="30" font-size="20" >Kernel density estimate: a bump on every point, then add</text>
  <text class="t" x="132" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">0</text>
  <text class="t" x="204" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">1</text>
  <text class="t" x="276" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">2</text>
  <text class="t" x="348" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">3</text>
  <text class="t" x="420" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">4</text>
  <text class="t" x="492" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">5</text>
  <text class="t" x="564" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">6</text>
  <text class="t" x="636" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">7</text>
  <text class="t" x="708" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">8</text>
  <text class="t" x="560" y="120" font-size="16" style="fill:#1971c2">sum of bumps = estimated PDF</text>
  <text class="t" x="600" y="230" font-size="16" style="fill:#f08c00">one bump per point (area 1/n)</text>
  <text class="t" x="60" y="380" font-size="15" style="fill:#e03131">5 data points</text>
  <text class="t" x="250" y="395" font-size="17" >f̂(x) = (1/n) · Σ K_h(x − xᵢ)</text>
  <text class="t" x="520" y="395" font-size="15" style="fill:#868e96">K_h = normal bump, width h</text>
  <text class="t" x="20" y="425" font-size="14" style="fill:#9c36b5">where points crowd together the bumps stack up → high density; lonely points give a low hump</text>
</svg>
