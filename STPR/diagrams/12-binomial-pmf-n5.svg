<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="43" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatchRed" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.8"/>
    </pattern>
    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="820" height="410" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M60 320 L790 320"/>
    <rect x="90" y="298" width="70" height="22" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <rect x="205" y="210" width="70" height="110" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <rect x="320" y="100" width="70" height="220" fill="url(#hatchRed)" stroke="#e03131" stroke-width="3"/>
    <rect x="435" y="100" width="70" height="220" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <rect x="550" y="210" width="70" height="110" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <rect x="665" y="298" width="70" height="22" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  </g>

  <text class="t" x="100" y="288" font-size="16" style="fill:#1971c2">1/32</text>
  <text class="t" x="120" y="345" font-size="17">0</text>
  <text class="t" x="215" y="200" font-size="16" style="fill:#1971c2">5/32</text>
  <text class="t" x="235" y="345" font-size="17">1</text>
  <text class="t" x="330" y="90" font-size="16" style="fill:#e03131">10/32</text>
  <text class="t" x="350" y="345" font-size="17">2</text>
  <text class="t" x="445" y="90" font-size="16" style="fill:#1971c2">10/32</text>
  <text class="t" x="465" y="345" font-size="17">3</text>
  <text class="t" x="560" y="200" font-size="16" style="fill:#1971c2">5/32</text>
  <text class="t" x="580" y="345" font-size="17">4</text>
  <text class="t" x="675" y="288" font-size="16" style="fill:#1971c2">1/32</text>
  <text class="t" x="695" y="345" font-size="17">5</text>
  <text class="t" x="20" y="30" font-size="19">X = heads in 5 fair coin flips   (n = 5, p = 0.5)</text>
  <text class="t" x="330" y="68" font-size="17" style="fill:#e03131">x = 2:  10 ways × (1/2)² × (1/2)³ = 10/32 ≈ 0.31</text>
  <text class="t" x="60" y="392" font-size="20">P(X = x) = C(5, x) · pˣ · (1 − p)⁵⁻ˣ</text>
  <text class="t" x="560" y="392" font-size="16" style="fill:#868e96">all bars: 32/32 = 1</text>
</svg>
