  <text class="t" x="20" y="30" font-size="19">3 coin flips → 8 equally likely outcomes</text>
  <text class="t" x="470" y="30" font-size="19" style="fill:#e03131">X = number of heads</text>
  <text class="t" x="560" y="120" font-size="19">PMF:  P(X = x)</text>
  <text class="t" x="560" y="145" font-size="15" style="fill:#868e96">bars add up to 8/8 = 1</text>
  <text class="t" x="200" y="422" font-size="15" style="fill:#868e96">the random variable X turns each outcome into a number</text>
