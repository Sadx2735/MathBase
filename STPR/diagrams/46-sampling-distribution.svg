  <text class="t" x="20" y="32" font-size="20" >Take a new sample → get a new x̄. The x̄ values have their own distribution.</text>
  <text class="t" x="105.0" y="210.95" font-size="17" text-anchor="middle">population</text>
  <text class="t" x="105" y="262" font-size="14" text-anchor="middle" style="fill:#868e96">μ = 170 cm</text>
  <text class="t" x="340.0" y="97.25" font-size="15" text-anchor="middle">sample 1</text>
  <text class="t" x="460" y="98" font-size="16" style="fill:#9c36b5">x̄₁ = 168.2</text>
  <text class="t" x="340.0" y="177.25" font-size="15" text-anchor="middle">sample 2</text>
  <text class="t" x="460" y="178" font-size="16" style="fill:#9c36b5">x̄₂ = 171.5</text>
  <text class="t" x="340.0" y="257.25" font-size="15" text-anchor="middle">sample 3</text>
  <text class="t" x="460" y="258" font-size="16" style="fill:#9c36b5">x̄₃ = 169.8</text>
  <text class="t" x="340.0" y="337.25" font-size="15" text-anchor="middle">…</text>
  <text class="t" x="460" y="338" font-size="16" style="fill:#868e96">…</text>
  <text class="t" x="748" y="360" font-size="15" text-anchor="middle" style="fill:#9c36b5">histogram of many x̄</text>
  <text class="t" x="748" y="382" font-size="15" text-anchor="middle" style="fill:#9c36b5">centre μ, width σ/√n</text>
  <text class="t" x="20" y="415" font-size="16" >X̄ (capital) = the random value before we sample; x̄ (small) = the number we got</text>
</svg>
