  <text class="t" x="20" y="30" font-size="19">Normal distribution: μ = 2, σ = 2.5</text>
  <text class="t" x="128" y="326" font-size="15">-5.5</text>
  <text class="t" x="132" y="354" font-size="15" style="fill:#9c36b5">-3</text>
  <text class="t" x="228" y="326" font-size="15">-3</text>
  <text class="t" x="232" y="354" font-size="15" style="fill:#9c36b5">-2</text>
  <text class="t" x="328" y="326" font-size="15">-0.5</text>
  <text class="t" x="332" y="354" font-size="15" style="fill:#9c36b5">-1</text>
  <text class="t" x="428" y="326" font-size="15">2</text>
  <text class="t" x="432" y="354" font-size="15" style="fill:#9c36b5">0</text>
  <text class="t" x="528" y="326" font-size="15">4.5</text>
  <text class="t" x="532" y="354" font-size="15" style="fill:#9c36b5">+1</text>
  <text class="t" x="628" y="326" font-size="15">7</text>
  <text class="t" x="632" y="354" font-size="15" style="fill:#9c36b5">+2</text>
  <text class="t" x="728" y="326" font-size="15">9.5</text>
  <text class="t" x="732" y="354" font-size="15" style="fill:#9c36b5">+3</text>
  <text class="t" x="20" y="326" font-size="15">x:</text>
  <text class="t" x="20" y="354" font-size="15" style="fill:#9c36b5">z:</text>
  <text class="t" x="420" y="230" font-size="18">68%</text>
  <text class="t" x="285" y="285" font-size="14">95%</text>
  <text class="t" x="105" y="278" font-size="14">99.7%</text>
  <text class="t" x="448" y="70" font-size="18" style="fill:#e03131">μ</text>
  <text class="t" x="620" y="70" font-size="16" style="fill:#1971c2">μ ± 1σ → 68%</text>
  <text class="t" x="620" y="94" font-size="16" style="fill:#2f9e44">μ ± 2σ → 95%</text>
  <text class="t" x="620" y="118" font-size="16" style="fill:#f08c00">μ ± 3σ → 99.7%</text>
  <text class="t" x="40" y="395" font-size="18" style="fill:#9c36b5">standardise:  z = (x − μ) / σ = (x − 2) / 2.5</text>
  <text class="t" x="560" y="395" font-size="15" style="fill:#868e96">→ every normal becomes N(0, 1)</text>
</svg>
