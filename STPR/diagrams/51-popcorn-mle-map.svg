<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="151" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="20" y="50" width="420" height="330" rx="16" fill="none" stroke="#ced4da" stroke-width="2"/>
    <rect x="100" y="244.21052631578948" width="80" height="75.78947368421053" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <rect x="280" y="140.0" width="80" height="180.0" rx="3" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
    <line x1="60" y1="320" x2="400" y2="320" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="460" y="50" width="420" height="330" rx="16" fill="none" stroke="#ced4da" stroke-width="2"/>
    <rect x="540" y="140.0" width="80" height="180.0" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <rect x="720" y="315.725" width="80" height="4.275" rx="3" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
    <line x1="500" y1="320" x2="840" y2="320" stroke="#1e1e1e" stroke-width="2"/>
  </g>

  <text class="t" x="20" y="32" font-size="20" >Popcorn on the floor: which reason? MLE vs MAP can disagree</text>
  <text class="t" x="230" y="78" font-size="17" text-anchor="middle">MLE: only P(popcorn | reason)</text>
  <text class="t" x="230" y="100" font-size="14" text-anchor="middle" style="fill:#868e96">likelihood alone</text>
  <text class="t" x="140" y="234.21052631578948" font-size="17" text-anchor="middle" style="fill:#1971c2">0.4</text>
  <text class="t" x="140" y="344" font-size="16" text-anchor="middle">movie night</text>
  <text class="t" x="320" y="130.0" font-size="17" text-anchor="middle" style="fill:#f08c00">0.95</text>
  <text class="t" x="320" y="344" font-size="16" text-anchor="middle">popcorn contest</text>
  <text class="t" x="670" y="78" font-size="17" text-anchor="middle">MAP: P(reason) × P(popcorn | reason)</text>
  <text class="t" x="670" y="100" font-size="14" text-anchor="middle" style="fill:#868e96">prior 0.1 vs 0.001, times likelihood</text>
  <text class="t" x="580" y="130.0" font-size="17" text-anchor="middle" style="fill:#1971c2">0.04</text>
  <text class="t" x="580" y="344" font-size="16" text-anchor="middle">movie night</text>
  <text class="t" x="760" y="305.725" font-size="17" text-anchor="middle" style="fill:#f08c00">0.00095</text>
  <text class="t" x="760" y="344" font-size="16" text-anchor="middle">popcorn contest</text>
  <text class="t" x="230" y="372" font-size="17" text-anchor="middle" style="fill:#f08c00">contest wins ✗</text>
  <text class="t" x="670" y="372" font-size="17" text-anchor="middle" style="fill:#1971c2">movie wins ✓</text>
  <text class="t" x="20" y="418" font-size="17" >a contest explains the popcorn better, but contests almost never happen</text>
  <text class="t" x="20" y="446" font-size="15" style="fill:#868e96">MAP multiplies by the prior (how common the reason is) before comparing</text>
</svg>
