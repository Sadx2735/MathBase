  <text class="t" x="20" y="30" font-size="20" >Standardising: same shape, new ruler</text>
  <text class="t" x="155" y="88" font-size="15" text-anchor="middle" style="fill:#1971c2">X ~ N(40, 5²)</text>
  <text class="t" x="125" y="274" font-size="13" text-anchor="middle">35</text>
  <text class="t" x="155" y="274" font-size="13" text-anchor="middle">40</text>
  <text class="t" x="185" y="274" font-size="13" text-anchor="middle">45</text>
  <text class="t" x="155" y="330" font-size="15" text-anchor="middle">E = 40, Var = 25</text>
  <text class="t" x="455" y="88" font-size="15" text-anchor="middle" style="fill:#f08c00">X − 40 ~ N(0, 5²)</text>
  <text class="t" x="425" y="274" font-size="13" text-anchor="middle">-5</text>
  <text class="t" x="455" y="274" font-size="13" text-anchor="middle">0</text>
  <text class="t" x="485" y="274" font-size="13" text-anchor="middle">5</text>
  <text class="t" x="455" y="330" font-size="15" text-anchor="middle">E = 0, Var = 25</text>
  <text class="t" x="755" y="88" font-size="15" text-anchor="middle" style="fill:#9c36b5">Z = (X − 40)/5 ~ N(0, 1)</text>
  <text class="t" x="725" y="274" font-size="13" text-anchor="middle">-1</text>
  <text class="t" x="755" y="274" font-size="13" text-anchor="middle">0</text>
  <text class="t" x="785" y="274" font-size="13" text-anchor="middle">1</text>
  <text class="t" x="755" y="330" font-size="15" text-anchor="middle">E = 0, Var = 1</text>
  <text class="t" x="305" y="165" font-size="16" text-anchor="middle">− μ</text>
  <text class="t" x="605" y="165" font-size="16" text-anchor="middle">÷ σ</text>
  <text class="t" x="30" y="375" font-size="16" >E[Z] = (E[X] − μ)/σ = 0</text>
  <text class="t" x="290" y="375" font-size="16" >Var(Z) = Var(X)/σ² = 1</text>
  <text class="t" x="540" y="375" font-size="14" style="fill:#868e96">(the aX + b rules with a = 1/σ, b = −μ/σ)</text>
</svg>
