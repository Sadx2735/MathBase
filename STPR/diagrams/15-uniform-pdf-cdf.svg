<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="59" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatchRed" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.8"/>
    </pattern>
    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M80 310 L400 310 M391.0 314.3 L400 310 L391.0 305.7" stroke="#1e1e1e"/>
    <path d="M80 310 L80 70 M84.3 79.0 L80 70 L75.7 79.0" stroke="#1e1e1e"/>
    <rect x="140" y="180" width="90" height="130" fill="url(#hatchRed)" stroke="#e03131"/>
    <path d="M80 180 L380 180" stroke="#1971c2" stroke-width="3"/>
    <path d="M380 180 L380 310" stroke="#1971c2" stroke-dasharray="6 6"/>
    <path d="M510 310 L860 310 M851.0 314.3 L860 310 L851.0 305.7" stroke="#1e1e1e"/>
    <path d="M520 320 L520 60 M524.3 69.0 L520 60 L515.7 69.0" stroke="#1e1e1e"/>
    <path d="M520 310 L820 90 L855 90" stroke="#2f9e44" stroke-width="3"/>
    <path d="M670 310 L670 200 L520 200" stroke="#9c36b5" stroke-dasharray="6 6"/>
    <path d="M515 90 L525 90"/>
  </g>

  <text class="t" x="20" y="30" font-size="19">Call length X ~ Uniform(0, 10) minutes</text>
  <text class="t" x="110" y="62" font-size="17" style="fill:#1971c2">PDF  f(x)</text>
  <text class="t" x="540" y="62" font-size="17" style="fill:#2f9e44">CDF  F(x) = P(X ≤ x)</text>
  <text class="t" x="30" y="186" font-size="15" style="fill:#1971c2">1/10</text>
  <text class="t" x="74" y="332" font-size="15">0</text>
  <text class="t" x="134" y="332" font-size="15">2</text>
  <text class="t" x="224" y="332" font-size="15">5</text>
  <text class="t" x="370" y="332" font-size="15">10</text>
  <text class="t" x="160" y="166" font-size="15" style="fill:#1971c2">height = 1/(b − a) = 1/10</text>
  <text class="t" x="40" y="372" font-size="16" style="fill:#e03131">P(2 ≤ X ≤ 5) = width × height = 3 × 1/10 = 0.3</text>
  <text class="t" x="500" y="95" font-size="15">1</text>
  <text class="t" x="482" y="205" font-size="15" style="fill:#9c36b5">0.5</text>
  <text class="t" x="514" y="332" font-size="15">0</text>
  <text class="t" x="664" y="332" font-size="15">5</text>
  <text class="t" x="810" y="332" font-size="15">10</text>
  <text class="t" x="540" y="372" font-size="16" style="fill:#2f9e44">F(x) = (x − a)/(b − a) = x/10</text>
  <text class="t" x="540" y="396" font-size="14" style="fill:#868e96">straight line: the PDF is constant,</text>
  <text class="t" x="540" y="416" font-size="14" style="fill:#868e96">so area builds up at a steady rate</text>
</svg>
