  <text class="t" x="20" y="32" font-size="20" >Conditional: take one slice of the joint, rescale it to total 1</text>
  <text class="t" x="225" y="78" font-size="17" text-anchor="middle">row “age 9” of the grid</text>
  <text class="t" x="89" y="322" font-size="13" text-anchor="middle" style="fill:#f08c00">0</text>
  <text class="t" x="131" y="322" font-size="13" text-anchor="middle" style="fill:#2f9e44">0</text>
  <text class="t" x="110" y="352" font-size="14" text-anchor="middle">45 in</text>
  <text class="t" x="199" y="297.0" font-size="13" text-anchor="middle" style="fill:#f08c00">0.1</text>
  <text class="t" x="241" y="259.5" font-size="13" text-anchor="middle" style="fill:#2f9e44">0.25</text>
  <text class="t" x="220" y="352" font-size="14" text-anchor="middle">47 in</text>
  <text class="t" x="309" y="247.0" font-size="13" text-anchor="middle" style="fill:#f08c00">0.3</text>
  <text class="t" x="351" y="134.5" font-size="13" text-anchor="middle" style="fill:#2f9e44">0.75</text>
  <text class="t" x="330" y="352" font-size="14" text-anchor="middle">49 in</text>
  <text class="t" x="64" y="114" font-size="14" style="fill:#f08c00">P(9, h): sums to 0.4</text>
  <text class="t" x="64" y="140" font-size="14" style="fill:#2f9e44">P(h | 9) = P(9, h) ÷ 0.4</text>
  <text class="t" x="225" y="400" font-size="15" text-anchor="middle" style="fill:#868e96">same shape, now sums to 1</text>
  <text class="t" x="667" y="78" font-size="17" text-anchor="middle">slices of the waiting-time PDF</text>
  <text class="t" x="500" y="352" font-size="14" text-anchor="middle">0</text>
  <text class="t" x="670" y="352" font-size="14" text-anchor="middle">5</text>
  <text class="t" x="840" y="352" font-size="14" text-anchor="middle">10</text>
  <text class="t" x="835" y="100.0" font-size="14" text-anchor="end" style="fill:#2f9e44">wait 0 min</text>
  <text class="t" x="508" y="100.0" font-size="14" style="fill:#e03131">wait 10 min</text>
  <text class="t" x="792.4" y="240.0" font-size="14" text-anchor="middle" style="fill:#868e96">wait 5 min</text>
  <text class="t" x="670" y="375" font-size="14" text-anchor="middle">rating y →</text>
  <text class="t" x="667" y="400" font-size="15" text-anchor="middle" style="fill:#868e96">short wait → ratings lean high</text>
  <text class="t" x="20" y="452" font-size="19" >discrete: P(y | x) = P(x, y) / P(x)</text>
  <text class="t" x="470" y="452" font-size="19" >continuous: f(y | x) = f(x, y) / f_X(x)</text>
</svg>
