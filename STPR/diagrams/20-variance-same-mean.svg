<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="79" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="55.0" y1="120" x2="825.0" y2="120" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="90.0" y1="115" x2="90.0" y2="125" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="265.0" y1="115" x2="265.0" y2="125" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="440.0" y1="115" x2="440.0" y2="125" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="615.0" y1="115" x2="615.0" y2="125" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="790.0" y1="115" x2="790.0" y2="125" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="440.0" y1="90" x2="440.0" y2="125" stroke="#9c36b5" stroke-width="2.5" stroke-dasharray="5 5"/>
    <circle cx="436.5" cy="120" r="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="443.5" cy="120" r="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <line x1="55.0" y1="250" x2="825.0" y2="250" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="90.0" y1="245" x2="90.0" y2="255" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="265.0" y1="245" x2="265.0" y2="255" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="440.0" y1="245" x2="440.0" y2="255" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="615.0" y1="245" x2="615.0" y2="255" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="790.0" y1="245" x2="790.0" y2="255" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="440.0" y1="220" x2="440.0" y2="255" stroke="#9c36b5" stroke-width="2.5" stroke-dasharray="5 5"/>
    <circle cx="90.0" cy="250" r="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="440.0" y1="232" x2="98.0" y2="232" stroke="#e03131" stroke-width="2"/>
    <path d="M107.9 227.2 L98.0 232 L107.9 236.8" stroke="#e03131" stroke-width="2" fill="none"/>
    <circle cx="790.0" cy="250" r="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="440.0" y1="232" x2="782.0" y2="232" stroke="#e03131" stroke-width="2"/>
    <path d="M772.1 236.8 L782.0 232 L772.1 227.2" stroke="#e03131" stroke-width="2" fill="none"/>
  </g>

  <text class="t" x="20" y="30" font-size="20" >Same mean (0), very different spread</text>
  <text class="t" x="90.0" y="144" font-size="13" text-anchor="middle" style="fill:#868e96">-100</text>
  <text class="t" x="265.0" y="144" font-size="13" text-anchor="middle" style="fill:#868e96">-50</text>
  <text class="t" x="440.0" y="144" font-size="13" text-anchor="middle" style="fill:#868e96">0</text>
  <text class="t" x="615.0" y="144" font-size="13" text-anchor="middle" style="fill:#868e96">50</text>
  <text class="t" x="790.0" y="144" font-size="13" text-anchor="middle" style="fill:#868e96">100</text>
  <text class="t" x="40" y="80" font-size="17" style="fill:#1971c2">Game A: win or lose $1</text>
  <text class="t" x="90.0" y="274" font-size="13" text-anchor="middle" style="fill:#868e96">-100</text>
  <text class="t" x="265.0" y="274" font-size="13" text-anchor="middle" style="fill:#868e96">-50</text>
  <text class="t" x="440.0" y="274" font-size="13" text-anchor="middle" style="fill:#868e96">0</text>
  <text class="t" x="615.0" y="274" font-size="13" text-anchor="middle" style="fill:#868e96">50</text>
  <text class="t" x="790.0" y="274" font-size="13" text-anchor="middle" style="fill:#868e96">100</text>
  <text class="t" x="40" y="210" font-size="17" style="fill:#e03131">Game B: win or lose $100</text>
  <text class="t" x="448.0" y="80" font-size="14" style="fill:#9c36b5">mean = 0</text>
  <text class="t" x="460.0" y="108" font-size="13" style="fill:#1971c2">both outcomes within $1 of 0</text>
  <text class="t" x="40" y="315.0" font-size="16" >average deviation: (+100) + (−100) = 0 → useless, it always cancels ✗</text>
  <text class="t" x="40" y="337.4" font-size="16" >average SQUARED deviation: (100² + 100²)/2 = 10,000 = Var  ✓</text>
  <text class="t" x="40" y="359.8" font-size="16" >SD = √Var = $100 (back in dollars)  ·  Game A: Var = 1, SD = $1</text>
</svg>
