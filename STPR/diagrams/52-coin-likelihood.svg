  <text class="t" x="20" y="32" font-size="20" >MLE for a coin: 8 heads, 2 tails → try every p, keep the best</text>
  <text class="t" x="90" y="392" font-size="14" text-anchor="middle">0</text>
  <text class="t" x="202.0" y="392" font-size="14" text-anchor="middle">0.2</text>
  <text class="t" x="314.0" y="392" font-size="14" text-anchor="middle">0.4</text>
  <text class="t" x="426.0" y="392" font-size="14" text-anchor="middle">0.6</text>
  <text class="t" x="538.0" y="392" font-size="14" text-anchor="middle">0.8</text>
  <text class="t" x="650" y="392" font-size="14" text-anchor="middle">1</text>
  <text class="t" x="325.2" y="95" font-size="16" style="fill:#e03131">peak at p = 0.8 = 8/10</text>
  <text class="t" x="134.8" y="235.0" font-size="15" style="fill:#1971c2">fair coin p = 0.5: 0.00098</text>
  <text class="t" x="370.0" y="418" font-size="15" text-anchor="middle">p = chance of heads (the model we are choosing)</text>
  <text class="t" x="680" y="120.0" font-size="16" >L(p) = p⁸ (1 − p)²</text>
  <text class="t" x="680" y="142.4" font-size="16" ></text>
  <text class="t" x="680" y="164.8" font-size="16" >L(0.8) ≈ 0.0067</text>
  <text class="t" x="680" y="187.2" font-size="16" >L(0.5) ≈ 0.0010</text>
  <text class="t" x="680" y="209.6" font-size="16" ></text>
  <text class="t" x="680" y="232.0" font-size="16" >0.8 makes the data</text>
  <text class="t" x="680" y="254.39999999999998" font-size="16" >about 7× more likely</text>
  <text class="t" x="20" y="437" font-size="15" style="fill:#868e96">height of the curve = how likely THIS exact sequence is, if the coin had that p</text>
</svg>
