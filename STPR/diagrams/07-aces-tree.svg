<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="21" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="880" height="380" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- left: with replacement -->
    <rect x="15" y="15" width="415" height="290" rx="16" stroke="#ced4da"/>
    <circle cx="55" cy="175" r="20" fill="#e9ecef"/>
    <line x1="75" y1="168" x2="160" y2="115"/>
    <line x1="75" y1="182" x2="160" y2="240" stroke="#adb5bd"/>
    <rect x="160" y="92" width="80" height="40" rx="10" fill="#ffc9c9" stroke="#e03131"/>
    <rect x="160" y="225" width="80" height="40" rx="10" stroke="#adb5bd"/>
    <line x1="240" y1="105" x2="310" y2="72"/>
    <line x1="240" y1="120" x2="310" y2="160" stroke="#adb5bd"/>
    <rect x="310" y="50" width="80" height="40" rx="10" fill="#ffc9c9" stroke="#e03131"/>
    <rect x="310" y="145" width="80" height="40" rx="10" stroke="#adb5bd"/>

    <!-- right: without replacement -->
    <rect x="450" y="15" width="415" height="290" rx="16" stroke="#ced4da"/>
    <circle cx="490" cy="175" r="20" fill="#e9ecef"/>
    <line x1="510" y1="168" x2="595" y2="115"/>
    <line x1="510" y1="182" x2="595" y2="240" stroke="#adb5bd"/>
    <rect x="595" y="92" width="80" height="40" rx="10" fill="#ffc9c9" stroke="#e03131"/>
    <rect x="595" y="225" width="80" height="40" rx="10" stroke="#adb5bd"/>
    <line x1="675" y1="105" x2="745" y2="72"/>
    <line x1="675" y1="120" x2="745" y2="160" stroke="#adb5bd"/>
    <rect x="745" y="50" width="80" height="40" rx="10" fill="#ffc9c9" stroke="#e03131"/>
    <rect x="745" y="145" width="80" height="40" rx="10" stroke="#adb5bd"/>
  </g>

  <text class="t" x="30" y="45" font-size="19">WITH replacement</text>
  <text class="t" x="30" y="66" font-size="14" style="fill:#868e96">(card goes back, deck reset)</text>
  <text class="t" x="465" y="45" font-size="19">WITHOUT replacement</text>
  <text class="t" x="465" y="66" font-size="14" style="fill:#868e96">(card stays out)</text>

  <text class="t" x="178" y="118" font-size="17">Ace</text>
  <text class="t" x="167" y="251" font-size="15" style="fill:#868e96">not Ace</text>
  <text class="t" x="328" y="76" font-size="17">Ace</text>
  <text class="t" x="317" y="171" font-size="15" style="fill:#868e96">not Ace</text>
  <text class="t" x="92" y="130" font-size="16" style="fill:#1971c2">4/52</text>
  <text class="t" x="80" y="230" font-size="15" style="fill:#adb5bd">48/52</text>
  <text class="t" x="255" y="78" font-size="16" style="fill:#1971c2">4/52</text>
  <text class="t" x="248" y="166" font-size="15" style="fill:#adb5bd">48/52</text>

  <text class="t" x="613" y="118" font-size="17">Ace</text>
  <text class="t" x="602" y="251" font-size="15" style="fill:#868e96">not Ace</text>
  <text class="t" x="763" y="76" font-size="17">Ace</text>
  <text class="t" x="752" y="171" font-size="15" style="fill:#868e96">not Ace</text>
  <text class="t" x="527" y="130" font-size="16" style="fill:#1971c2">4/52</text>
  <text class="t" x="515" y="230" font-size="15" style="fill:#adb5bd">48/52</text>
  <text class="t" x="690" y="78" font-size="16" style="fill:#e03131">3/51</text>
  <text class="t" x="683" y="166" font-size="15" style="fill:#adb5bd">48/51</text>

  <text class="t" x="25" y="340" font-size="19">P(both Aces) = 4/52 × 4/52 = 1/169</text>
  <text class="t" x="460" y="340" font-size="19">P(both Aces) = 4/52 × 3/51 = 1/221</text>
  <text class="t" x="460" y="366" font-size="14" style="fill:#e03131">1 Ace and 1 card already gone → 3 Aces left in 51</text>
</svg>
