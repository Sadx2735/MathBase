<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="101" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="30" y="50" width="400" height="300" rx="16" fill="none" stroke="#ced4da" stroke-width="2"/>
    <line x1="45" y1="270" x2="415" y2="270" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="60.0" y1="265" x2="60.0" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="145.0" y1="265" x2="145.0" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="230.0" y1="265" x2="230.0" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="315.0" y1="265" x2="315.0" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="400.0" y1="265" x2="400.0" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="219.3" y="120" width="18" height="150" rx="2" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
    <rect x="389.29999999999995" y="262" width="18" height="8" rx="1" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
    <path d="M365 165 Q 370.4 214.6 398.29999999999995 256" stroke="#2f9e44" stroke-width="2" fill="none"/>
    <path d="M388.8 250.5 L398.29999999999995 256 L396.7 245.1" stroke="#2f9e44" stroke-width="2" fill="none"/>
    <rect x="470" y="50" width="400" height="300" rx="16" fill="none" stroke="#ced4da" stroke-width="2"/>
    <line x1="485" y1="270" x2="855" y2="270" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="500.0" y1="265" x2="500.0" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="585.0" y1="265" x2="585.0" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="670.0" y1="265" x2="670.0" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="755.0" y1="265" x2="755.0" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="840.0" y1="265" x2="840.0" y2="275" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="662.7" y="120" width="18" height="150" rx="2" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <rect x="492.70000000000005" y="262" width="18" height="8" rx="1" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <path d="M511 165 Q 518.3 211.7 501.70000000000005 256" stroke="#e03131" stroke-width="2" fill="none"/>
    <path d="M500.7 245.0 L501.70000000000005 256 L509.7 248.4" stroke="#e03131" stroke-width="2" fill="none"/>
  </g>

  <text class="t" x="20" y="30" font-size="20" >Same mean, same variance, opposite skew</text>
  <text class="t" x="230" y="78" font-size="17" text-anchor="middle" style="fill:#2f9e44">Lottery ticket (you buy)</text>
  <text class="t" x="60.0" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">-100</text>
  <text class="t" x="145.0" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">-50</text>
  <text class="t" x="230.0" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">0</text>
  <text class="t" x="315.0" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">+50</text>
  <text class="t" x="400.0" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">+100</text>
  <text class="t" x="212.3" y="140" font-size="15" text-anchor="end" style="fill:#2f9e44">99%: -1 $</text>
  <text class="t" x="278.29999999999995" y="170" font-size="15" style="fill:#2f9e44">1%: +99 $</text>
  <text class="t" x="50" y="318.0" font-size="15" >mean 0 · Var 99 · skew +9.85</text>
  <text class="t" x="50" y="340" font-size="14" style="fill:#868e96">rare big WIN → long right tail</text>
  <text class="t" x="670" y="78" font-size="17" text-anchor="middle" style="fill:#e03131">Insurance (you sell)</text>
  <text class="t" x="500.0" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">-100</text>
  <text class="t" x="585.0" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">-50</text>
  <text class="t" x="670.0" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">0</text>
  <text class="t" x="755.0" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">+50</text>
  <text class="t" x="840.0" y="292" font-size="13" text-anchor="middle" style="fill:#868e96">+100</text>
  <text class="t" x="687.7" y="140" font-size="15" text-anchor="start" style="fill:#e03131">99%: +1 $</text>
  <text class="t" x="516.7" y="170" font-size="15" style="fill:#e03131">1%: -99 $</text>
  <text class="t" x="490" y="318.0" font-size="15" >mean 0 · Var 99 · skew −9.85</text>
  <text class="t" x="490" y="340" font-size="14" style="fill:#868e96">rare big LOSS → long left tail</text>
  <text class="t" x="30" y="385" font-size="17" >E[X³] = 0.99·(∓1)³ + 0.01·(±99)³ = ±9702</text>
  <text class="t" x="30" y="415" font-size="15" style="fill:#9c36b5">cubing keeps the sign, so the far-away value decides the sign of the 3rd moment</text>
</svg>
