<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e03131" stroke-width="1.8"/>
    </pattern>
    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="860" height="420" fill="#ffffff"/>

  <!-- grid: origin (120,70), cell 50; rows = 1st die, cols = 2nd die -->
  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="1.6" fill="none" stroke-linecap="round">
    <!-- row 6 = "first die is 6" -->
    <rect x="120" y="320" width="300" height="50" fill="#a5d8ff" stroke="#1971c2" stroke-width="2.5"/>
    <!-- sum = 10 cells: (4,6) (5,5) (6,4) -->
    <rect x="370" y="220" width="50" height="50" fill="url(#hatchRed)" stroke="#e03131" stroke-width="2.5"/>
    <rect x="320" y="270" width="50" height="50" fill="url(#hatchRed)" stroke="#e03131" stroke-width="2.5"/>
    <rect x="270" y="320" width="50" height="50" fill="url(#hatchRed)" stroke="#9c36b5" stroke-width="3.5"/>
    <!-- grid lines -->
    <path d="M120 70 H420 M120 120 H420 M120 170 H420 M120 220 H420 M120 270 H420 M120 320 H420 M120 370 H420"/>
    <path d="M120 70 V370 M170 70 V370 M220 70 V370 M270 70 V370 M320 70 V370 M370 70 V370 M420 70 V370"/>
    <!-- arrow to overlap -->
    <path d="M470 395 Q 380 410 300 375" stroke="#9c36b5" stroke-width="2"/>
    <path d="M300 375 L316 377 M300 375 L307 389" stroke="#9c36b5" stroke-width="2"/>
  </g>

  <text class="t" x="200" y="30" font-size="18">2nd die →</text>
  <text class="t" x="20" y="45" font-size="18">1st die ↓</text>
  <text class="t" x="140" y="62" font-size="16">1</text>
  <text class="t" x="190" y="62" font-size="16">2</text>
  <text class="t" x="240" y="62" font-size="16">3</text>
  <text class="t" x="290" y="62" font-size="16">4</text>
  <text class="t" x="340" y="62" font-size="16">5</text>
  <text class="t" x="390" y="62" font-size="16">6</text>
  <text class="t" x="100" y="100" font-size="16">1</text>
  <text class="t" x="100" y="150" font-size="16">2</text>
  <text class="t" x="100" y="200" font-size="16">3</text>
  <text class="t" x="100" y="250" font-size="16">4</text>
  <text class="t" x="100" y="300" font-size="16">5</text>
  <text class="t" x="100" y="350" font-size="16">6</text>
  <text class="t" x="476" y="400" font-size="15" style="fill:#9c36b5">(6,4) is in both</text>

  <text class="t" x="460" y="90" font-size="18" style="fill:#1971c2">A = first die is 6 → 6 cells</text>
  <text class="t" x="460" y="120" font-size="18" style="fill:#e03131">B = sum is 10 → 3 cells</text>

  <text class="t" x="460" y="170" font-size="18">P(A and B) = 1/36</text>
  <text class="t" x="460" y="210" font-size="18">P(B | A) = 1 cell / 6 cells = 1/6</text>
  <text class="t" x="460" y="250" font-size="18">P(A | B) = 1 cell / 3 cells = 1/3</text>
  <text class="t" x="460" y="300" font-size="16" style="fill:#868e96">"given A" = throw away everything</text>
  <text class="t" x="460" y="322" font-size="16" style="fill:#868e96">outside A and count again</text>
</svg>
