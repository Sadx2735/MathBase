  <text class="t" x="20" y="30" font-size="20" >Box plot vs violin plot of the SAME two-group data</text>
  <text class="t" x="170" y="76" font-size="16" text-anchor="middle">box plot</text>
  <text class="t" x="460" y="76" font-size="16" text-anchor="middle">violin plot</text>
  <text class="t" x="220" y="225" font-size="14" style="fill:#9c36b5">median here,</text>
  <text class="t" x="220" y="245" font-size="14" style="fill:#9c36b5">but no data here!</text>
  <text class="t" x="515" y="157" font-size="14" style="fill:#f08c00">group 2</text>
  <text class="t" x="515" y="309" font-size="14" style="fill:#f08c00">group 1</text>
  <text class="t" x="620" y="110.0" font-size="15" >violin = box plot +</text>
  <text class="t" x="620" y="131.0" font-size="15" >mirrored KDE on each side</text>
  <text class="t" x="620" y="152.0" font-size="15" ></text>
  <text class="t" x="620" y="173.0" font-size="15" >width at a height =</text>
  <text class="t" x="620" y="194.0" font-size="15" >how much data sits</text>
  <text class="t" x="620" y="215.0" font-size="15" >at that value</text>
  <text class="t" x="620" y="290.0" font-size="14" style="fill:#868e96">e.g. weights of cats</text>
  <text class="t" x="620" y="309.6" font-size="14" style="fill:#868e96">AND dogs in one column:</text>
  <text class="t" x="620" y="329.2" font-size="14" style="fill:#868e96">the box plot hides the</text>
  <text class="t" x="620" y="348.8" font-size="14" style="fill:#868e96">two groups, the violin</text>
  <text class="t" x="620" y="368.4" font-size="14" style="fill:#868e96">shows them</text>
  <text class="t" x="20" y="440" font-size="15" style="fill:#9c36b5">box plots summarise with 5 numbers; violins show the whole shape (peaks, gaps, skew)</text>
