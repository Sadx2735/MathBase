<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="135" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="170" y="110" width="110" height="62" rx="4" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="280" y="110" width="110" height="62" rx="4" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="390" y="110" width="110" height="62" rx="4" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="170" y="172" width="110" height="62" rx="4" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="280" y="172" width="110" height="62" rx="4" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="390" y="172" width="110" height="62" rx="4" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="170" y="234" width="110" height="62" rx="4" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="280" y="234" width="110" height="62" rx="4" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="390" y="234" width="110" height="62" rx="4" fill="#ffc9c9" stroke="#e03131" stroke-width="3"/>
    <rect x="520" y="110" width="110" height="62" rx="4" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
    <rect x="520" y="172" width="110" height="62" rx="4" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
    <rect x="520" y="234" width="110" height="62" rx="4" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
    <rect x="170" y="316" width="110" height="62" rx="4" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
    <rect x="280" y="316" width="110" height="62" rx="4" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
    <rect x="390" y="316" width="110" height="62" rx="4" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
    <rect x="520" y="316" width="110" height="62" rx="4" fill="none" stroke="#1e1e1e" stroke-width="2"/>
  </g>

  <text class="t" x="20" y="32" font-size="20" >Joint distribution: one grid holds P(age, height) for every pair</text>
  <text class="t" x="225.0" y="149" font-size="19" text-anchor="middle">2/10</text>
  <text class="t" x="335.0" y="149" font-size="19" text-anchor="middle">1/10</text>
  <text class="t" x="445.0" y="149" font-size="19" text-anchor="middle" style="fill:#868e96">0/10</text>
  <text class="t" x="155" y="148" font-size="17" text-anchor="end">age 7</text>
  <text class="t" x="225.0" y="211" font-size="19" text-anchor="middle" style="fill:#868e96">0/10</text>
  <text class="t" x="335.0" y="211" font-size="19" text-anchor="middle">1/10</text>
  <text class="t" x="445.0" y="211" font-size="19" text-anchor="middle">2/10</text>
  <text class="t" x="155" y="210" font-size="17" text-anchor="end">age 8</text>
  <text class="t" x="225.0" y="273" font-size="19" text-anchor="middle" style="fill:#868e96">0/10</text>
  <text class="t" x="335.0" y="273" font-size="19" text-anchor="middle">1/10</text>
  <text class="t" x="445.0" y="273" font-size="19" text-anchor="middle" style="fill:#e03131">3/10</text>
  <text class="t" x="155" y="272" font-size="17" text-anchor="end">age 9</text>
  <text class="t" x="225.0" y="96" font-size="17" text-anchor="middle">45 in</text>
  <text class="t" x="335.0" y="96" font-size="17" text-anchor="middle">47 in</text>
  <text class="t" x="445.0" y="96" font-size="17" text-anchor="middle">49 in</text>
  <text class="t" x="335.0" y="68" font-size="16" text-anchor="middle" style="fill:#868e96">height →</text>
  <text class="t" x="155" y="68" font-size="16" text-anchor="end" style="fill:#868e96">age ↓</text>
  <text class="t" x="575" y="96" font-size="17" text-anchor="middle" style="fill:#9c36b5">P(age)</text>
  <text class="t" x="575" y="149" font-size="19" text-anchor="middle" style="fill:#9c36b5">3/10</text>
  <text class="t" x="575" y="211" font-size="19" text-anchor="middle" style="fill:#9c36b5">3/10</text>
  <text class="t" x="575" y="273" font-size="19" text-anchor="middle" style="fill:#9c36b5">4/10</text>
  <text class="t" x="155" y="354" font-size="17" text-anchor="end" style="fill:#2f9e44">P(height)</text>
  <text class="t" x="225.0" y="355" font-size="19" text-anchor="middle" style="fill:#2f9e44">2/10</text>
  <text class="t" x="335.0" y="355" font-size="19" text-anchor="middle" style="fill:#2f9e44">3/10</text>
  <text class="t" x="445.0" y="355" font-size="19" text-anchor="middle" style="fill:#2f9e44">5/10</text>
  <text class="t" x="575" y="355" font-size="19" text-anchor="middle">1</text>
  <text class="t" x="660" y="135.0" font-size="15" style="fill:#868e96">each cell = P(x, y)</text>
  <text class="t" x="660" y="156.0" font-size="15" style="fill:#868e96">all 9 cells add up to 1</text>
  <text class="t" x="660" y="177.0" font-size="15" style="fill:#868e96"></text>
  <text class="t" x="660" y="198.0" font-size="15" style="fill:#868e96">row sum → P(age)</text>
  <text class="t" x="660" y="219.0" font-size="15" style="fill:#868e96">column sum → P(height)</text>
  <text class="t" x="660" y="240.0" font-size="15" style="fill:#868e96">(written in the margins,</text>
  <text class="t" x="660" y="261.0" font-size="15" style="fill:#868e96"> hence “marginal”)</text>
  <text class="t" x="20" y="425" font-size="20" style="fill:#e03131">P(age 9, height 49) = 3/10 (the red cell)</text>
  <text class="t" x="20" y="455" font-size="15" style="fill:#868e96">10 children: counts ÷ 10 give the probabilities</text>
</svg>
