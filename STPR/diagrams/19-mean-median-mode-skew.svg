  <text class="t" x="20" y="30" font-size="20" >Skewed salaries: mode &lt; median &lt; mean</text>
  <text class="t" x="162.0" y="82" font-size="16" text-anchor="end" style="fill:#2f9e44">mode</text>
  <text class="t" x="231.01999999999998" y="82" font-size="16" text-anchor="middle" style="fill:#f08c00">median</text>
  <text class="t" x="270.0" y="112" font-size="16" style="fill:#e03131">mean</text>
  <text class="t" x="520" y="200" font-size="16" style="fill:#9c36b5">a few huge salaries (long tail)</text>
  <text class="t" x="520" y="228" font-size="15" style="fill:#9c36b5">pull the mean to the right</text>
  <text class="t" x="780" y="355" font-size="15" text-anchor="end">salary →</text>
  <text class="t" x="40" y="380.0" font-size="14" style="fill:#868e96">mode = most common value · median = middle value (half below, half above) · mean = balance point</text>
  <text class="t" x="40" y="399.6" font-size="14" style="fill:#868e96">for skewed data like salaries or house prices, the median is the honest 'typical' value</text>
</svg>
