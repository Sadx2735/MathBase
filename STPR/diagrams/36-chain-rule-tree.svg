<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="136" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="365" y="55" width="150" height="44" rx="10" fill="none" stroke="#adb5bd" stroke-width="2"/>
    <line x1="440" y1="99" x2="135" y2="160" stroke="#adb5bd" stroke-width="2"/>
    <rect x="60" y="160" width="150" height="44" rx="10" fill="none" stroke="#adb5bd" stroke-width="2"/>
    <line x1="440" y1="99" x2="335" y2="160" stroke="#adb5bd" stroke-width="2"/>
    <rect x="260" y="160" width="150" height="44" rx="10" fill="none" stroke="#adb5bd" stroke-width="2"/>
    <line x1="440" y1="99" x2="635" y2="160" stroke="#1e1e1e" stroke-width="2.5"/>
    <rect x="560" y="160" width="150" height="44" rx="10" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
    <line x1="635" y1="204" x2="480" y2="280" stroke="#adb5bd" stroke-width="2"/>
    <rect x="420" y="280" width="120" height="44" rx="10" fill="none" stroke="#adb5bd" stroke-width="2"/>
    <line x1="635" y1="204" x2="635" y2="280" stroke="#adb5bd" stroke-width="2"/>
    <rect x="575" y="280" width="120" height="44" rx="10" fill="none" stroke="#adb5bd" stroke-width="2"/>
    <line x1="635" y1="204" x2="790" y2="280" stroke="#e03131" stroke-width="2.5"/>
    <rect x="730" y="280" width="120" height="44" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
  </g>

  <text class="t" x="20" y="32" font-size="20" >Building a joint probability: multiply along the path</text>
  <text class="t" x="440.0" y="82.95" font-size="17" text-anchor="middle">10 children</text>
  <text class="t" x="135.0" y="187.95" font-size="17" text-anchor="middle" style="fill:#868e96">age 7</text>
  <text class="t" x="335.0" y="187.95" font-size="17" text-anchor="middle" style="fill:#868e96">age 8</text>
  <text class="t" x="635.0" y="187.95" font-size="17" text-anchor="middle">age 9</text>
  <text class="t" x="225" y="125" font-size="16" style="fill:#adb5bd">3/10</text>
  <text class="t" x="372" y="150" font-size="16" style="fill:#adb5bd">3/10</text>
  <text class="t" x="560" y="125" font-size="16" style="fill:#9c36b5">P(9) = 4/10</text>
  <text class="t" x="480.0" y="307.95" font-size="17" text-anchor="middle" style="fill:#868e96">45 in</text>
  <text class="t" x="635.0" y="307.95" font-size="17" text-anchor="middle" style="fill:#868e96">47 in</text>
  <text class="t" x="790.0" y="307.95" font-size="17" text-anchor="middle">49 in</text>
  <text class="t" x="500" y="245" font-size="16" style="fill:#adb5bd">0</text>
  <text class="t" x="612" y="250" font-size="16" text-anchor="end" style="fill:#adb5bd">1/4</text>
  <text class="t" x="735" y="240" font-size="16" style="fill:#e03131">P(49 | 9) = 3/4</text>
  <text class="t" x="20" y="375" font-size="21" style="fill:#e03131">P(9, 49) = P(9) × P(49 | 9) = 4/10 × 3/4 = 3/10</text>
  <text class="t" x="20" y="408" font-size="15" style="fill:#868e96">of the 4 nine-year-olds, 3 are 49 in tall → same answer as the red cell of the grid</text>
</svg>
