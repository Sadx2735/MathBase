  <text class="t" x="20" y="30" font-size="20" >The sign of the skew points to the long tail</text>
  <text class="t" x="165" y="290" font-size="15" text-anchor="middle" style="fill:#e03131">negative skew (left tail)</text>
  <text class="t" x="165" y="315" font-size="13" text-anchor="middle" style="fill:#868e96">e.g. exam scores on an easy test</text>
  <text class="t" x="455" y="290" font-size="15" text-anchor="middle" style="fill:#1971c2">zero skew (symmetric)</text>
  <text class="t" x="455" y="315" font-size="13" text-anchor="middle" style="fill:#868e96">e.g. heights</text>
  <text class="t" x="745" y="290" font-size="15" text-anchor="middle" style="fill:#2f9e44">positive skew (right tail)</text>
  <text class="t" x="745" y="315" font-size="13" text-anchor="middle" style="fill:#868e96">e.g. salaries, house prices</text>
  <text class="t" x="80" y="200" font-size="14" style="fill:#e03131">tail</text>
  <text class="t" x="800" y="200" font-size="14" style="fill:#2f9e44">tail</text>
  <text class="t" x="20" y="345" font-size="14" style="fill:#868e96">skew = E[ ((X − μ)/σ)³ ]  ·  mean is pulled toward the tail: mean &lt; median for −, mean &gt; median for +</text>
</svg>
