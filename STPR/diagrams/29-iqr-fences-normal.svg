  <text class="t" x="20" y="30" font-size="20" >Middle 50%, and where the 1.5 × IQR fences land</text>
  <text class="t" x="70" y="343" font-size="13" text-anchor="middle" style="fill:#868e96">-4σ</text>
  <text class="t" x="165" y="343" font-size="13" text-anchor="middle" style="fill:#868e96">-3σ</text>
  <text class="t" x="260" y="343" font-size="13" text-anchor="middle" style="fill:#868e96">-2σ</text>
  <text class="t" x="355" y="343" font-size="13" text-anchor="middle" style="fill:#868e96">-1σ</text>
  <text class="t" x="450" y="343" font-size="13" text-anchor="middle" style="fill:#868e96">μ</text>
  <text class="t" x="545" y="343" font-size="13" text-anchor="middle" style="fill:#868e96">+1σ</text>
  <text class="t" x="640" y="343" font-size="13" text-anchor="middle" style="fill:#868e96">+2σ</text>
  <text class="t" x="735" y="343" font-size="13" text-anchor="middle" style="fill:#868e96">+3σ</text>
  <text class="t" x="830" y="343" font-size="13" text-anchor="middle" style="fill:#868e96">+4σ</text>
  <text class="t" x="450" y="265" font-size="20" text-anchor="middle" style="fill:#1971c2">50%</text>
  <text class="t" x="317.0" y="300" font-size="16" text-anchor="middle" style="fill:#868e96">25%</text>
  <text class="t" x="583.0" y="300" font-size="16" text-anchor="middle" style="fill:#868e96">25%</text>
  <text class="t" x="379.92347373137227" y="100" font-size="14" text-anchor="end" style="fill:#2f9e44">Q1 = −0.67σ</text>
  <text class="t" x="520.0765262686277" y="100" font-size="14" style="fill:#2f9e44">Q3 = +0.67σ</text>
  <text class="t" x="450" y="145" font-size="14" text-anchor="middle" style="fill:#2f9e44">IQR ≈ 1.35σ</text>
  <text class="t" x="610.1913156715693" y="182" font-size="14" text-anchor="middle" style="fill:#e03131">1.5 × IQR</text>
  <text class="t" x="712.306105074511" y="170" font-size="14" style="fill:#e03131">fence ≈ +2.7σ</text>
  <text class="t" x="187.69389492548896" y="170" font-size="14" text-anchor="end" style="fill:#e03131">fence ≈ −2.7σ</text>
  <text class="t" x="20" y="385" font-size="16" >for normal data only ≈ 0.7% of points fall outside the fences → anything out there is suspicious</text>
  <text class="t" x="20" y="415" font-size="14" style="fill:#868e96">and Q1, Q3 barely move when an outlier appears, unlike mean ± 3·SD (the outlier inflates the SD itself)</text>
</svg>
