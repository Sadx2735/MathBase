  <text class="t" x="20" y="32" font-size="20" >Covariance = average signed area of the rectangles from the mean point</text>
  <text class="t" x="230" y="75" font-size="16" text-anchor="middle">age vs height</text>
  <text class="t" x="392" y="108" font-size="14" text-anchor="end" style="fill:#2f9e44">+ × + = +</text>
  <text class="t" x="78" y="330" font-size="14" style="fill:#2f9e44">− × − = +</text>
  <text class="t" x="78" y="108" font-size="14" style="fill:#e03131">− × + = −</text>
  <text class="t" x="392" y="330" font-size="14" text-anchor="end" style="fill:#e03131">+ × − = −</text>
  <text class="t" x="247.0" y="225.63636363636365" font-size="13" style="fill:#9c36b5">(x̄, ȳ)</text>
  <text class="t" x="230" y="382" font-size="13" text-anchor="middle" style="fill:#2f9e44">products: 8 + 2 + 0 + 2 + 6 = 18 → ÷5 = +3.6</text>
  <text class="t" x="670" y="75" font-size="16" text-anchor="middle">age vs naps</text>
  <text class="t" x="832" y="108" font-size="14" text-anchor="end" style="fill:#2f9e44">+ × + = +</text>
  <text class="t" x="518" y="330" font-size="14" style="fill:#2f9e44">− × − = +</text>
  <text class="t" x="518" y="108" font-size="14" style="fill:#e03131">− × + = −</text>
  <text class="t" x="832" y="330" font-size="14" text-anchor="end" style="fill:#e03131">+ × − = −</text>
  <text class="t" x="687.0" y="203.0" font-size="13" style="fill:#9c36b5">(x̄, ȳ)</text>
  <text class="t" x="670" y="382" font-size="13" text-anchor="middle" style="fill:#e03131">products: −2 − 1 + 0 − 1 − 2 = −6 → ÷5 = −1.2</text>
  <text class="t" x="20" y="425" font-size="20" >Cov(X, Y) = (1/N) Σ (xᵢ − x̄)(yᵢ − ȳ)</text>
  <text class="t" x="20" y="455" font-size="15" style="fill:#868e96">green rectangles add, red ones subtract: the bigger total wins the sign</text>
</svg>
