<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="157" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="900" height="450" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="20" y="50" width="275" height="310" rx="16" fill="none" stroke="#ced4da" stroke-width="2"/>
    <rect x="65" y="157.0" width="70" height="153.0" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <rect x="180" y="293.0" width="70" height="17.0" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="45" y1="310" x2="270" y2="310" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="282" y1="205" x2="322" y2="205" stroke="#9c36b5" stroke-width="2"/>
    <path d="M312.1 209.8 L322 205 L312.1 200.2" stroke="#9c36b5" stroke-width="2" fill="none"/>
    <rect x="312" y="50" width="275" height="310" rx="16" fill="none" stroke="#ced4da" stroke-width="2"/>
    <rect x="357" y="213.61" width="70" height="96.38999999999999" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <rect x="472" y="236.39" width="70" height="73.61" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="337" y1="310" x2="562" y2="310" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="574" y1="205" x2="614" y2="205" stroke="#9c36b5" stroke-width="2"/>
    <path d="M604.1 209.8 L614 205 L604.1 200.2" stroke="#9c36b5" stroke-width="2" fill="none"/>
    <rect x="604" y="50" width="275" height="310" rx="16" fill="none" stroke="#ced4da" stroke-width="2"/>
    <rect x="649" y="282.8" width="70" height="27.2" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <rect x="764" y="167.20000000000002" width="70" height="142.79999999999998" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="629" y1="310" x2="854" y2="310" stroke="#1e1e1e" stroke-width="2"/>
  </g>

  <text class="t" x="20" y="32" font-size="20" >Updating a belief: today's posterior is tomorrow's prior</text>
  <text class="t" x="157" y="78" font-size="17" text-anchor="middle">prior</text>
  <text class="t" x="157" y="100" font-size="14" text-anchor="middle" style="fill:#868e96">before any flips</text>
  <text class="t" x="100" y="147.0" font-size="17" text-anchor="middle" style="fill:#1971c2">0.90</text>
  <text class="t" x="100" y="332" font-size="14" text-anchor="middle">fair</text>
  <text class="t" x="215" y="283.0" font-size="17" text-anchor="middle" style="fill:#e03131">0.10</text>
  <text class="t" x="215" y="332" font-size="14" text-anchor="middle">biased 0.8</text>
  <text class="t" x="449" y="78" font-size="17" text-anchor="middle">after 10 flips</text>
  <text class="t" x="449" y="100" font-size="14" text-anchor="middle" style="fill:#868e96">8 heads, 2 tails</text>
  <text class="t" x="392" y="203.61" font-size="17" text-anchor="middle" style="fill:#1971c2">0.57</text>
  <text class="t" x="392" y="332" font-size="14" text-anchor="middle">fair</text>
  <text class="t" x="507" y="226.39" font-size="17" text-anchor="middle" style="fill:#e03131">0.43</text>
  <text class="t" x="507" y="332" font-size="14" text-anchor="middle">biased 0.8</text>
  <text class="t" x="741" y="78" font-size="17" text-anchor="middle">after 20 flips</text>
  <text class="t" x="741" y="100" font-size="14" text-anchor="middle" style="fill:#868e96">another 8 H, 2 T</text>
  <text class="t" x="684" y="272.8" font-size="17" text-anchor="middle" style="fill:#1971c2">0.16</text>
  <text class="t" x="684" y="332" font-size="14" text-anchor="middle">fair</text>
  <text class="t" x="799" y="157.20000000000002" font-size="17" text-anchor="middle" style="fill:#e03131">0.84</text>
  <text class="t" x="799" y="332" font-size="14" text-anchor="middle">biased 0.8</text>
  <text class="t" x="20" y="400" font-size="16" >posterior ∝ prior × likelihood  (fair: 0.5¹⁰ ≈ 0.00098, biased: 0.8⁸·0.2² ≈ 0.0067)</text>
  <text class="t" x="20" y="430" font-size="15" style="fill:#868e96">a strong prior needs a lot of evidence to flip, but enough evidence always wins</text>
</svg>
