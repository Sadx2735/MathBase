  <text class="t" x="20" y="30" font-size="20" >Quantiles: cut the sorted data into equal-count pieces</text>
  <text class="t" x="205" y="82" font-size="16" text-anchor="middle">newspaper budgets (n = 4)</text>
  <text class="t" x="88" y="222" font-size="12" text-anchor="middle" style="fill:#868e96">8</text>
  <text class="t" x="136" y="222" font-size="12" text-anchor="middle" style="fill:#868e96">10</text>
  <text class="t" x="184" y="222" font-size="12" text-anchor="middle" style="fill:#868e96">12</text>
  <text class="t" x="232" y="222" font-size="12" text-anchor="middle" style="fill:#868e96">14</text>
  <text class="t" x="280" y="222" font-size="12" text-anchor="middle" style="fill:#868e96">16</text>
  <text class="t" x="328" y="222" font-size="12" text-anchor="middle" style="fill:#868e96">18</text>
  <text class="t" x="376" y="222" font-size="12" text-anchor="middle" style="fill:#868e96">20</text>
  <text class="t" x="104.79999999999998" y="162" font-size="14" text-anchor="middle" style="fill:#1971c2">8.7</text>
  <text class="t" x="236.79999999999998" y="162" font-size="14" text-anchor="middle" style="fill:#1971c2">14.2</text>
  <text class="t" x="336.40000000000003" y="162" font-size="14" text-anchor="middle" style="fill:#1971c2">18.3, 18.4</text>
  <text class="t" x="286.0" y="112" font-size="14" text-anchor="middle" style="fill:#9c36b5">median 16.25</text>
  <text class="t" x="35" y="255.0" font-size="13" style="fill:#868e96">even n → average the two middle</text>
  <text class="t" x="35" y="273.2" font-size="13" style="fill:#868e96">values: (14.2 + 18.3)/2 = 16.25</text>
  <text class="t" x="35" y="291.4" font-size="13" style="fill:#868e96">Q1 is 8.7 or 12.8 depending on the</text>
  <text class="t" x="35" y="309.6" font-size="13" style="fill:#868e96">rule (few points → rules disagree)</text>
  <text class="t" x="645" y="82" font-size="16" text-anchor="middle">read the CDF backwards</text>
  <text class="t" x="452" y="275.0" font-size="13" text-anchor="end" style="fill:#2f9e44">0.25</text>
  <text class="t" x="524.5992833131162" y="318" font-size="13" style="fill:#2f9e44">Q1</text>
  <text class="t" x="452" y="215.0" font-size="13" text-anchor="end" style="fill:#9c36b5">0.5</text>
  <text class="t" x="569.057513381033" y="318" font-size="13" style="fill:#9c36b5">Q2</text>
  <text class="t" x="452" y="155.0" font-size="13" text-anchor="end" style="fill:#2f9e44">0.75</text>
  <text class="t" x="631.9433407911611" y="318" font-size="13" style="fill:#2f9e44">Q3</text>
  <text class="t" x="452" y="119.0" font-size="13" text-anchor="end" style="fill:#f08c00">0.9</text>
  <text class="t" x="706.1626505317806" y="318" font-size="13" style="fill:#f08c00">P90</text>
  <text class="t" x="865" y="352" font-size="13" text-anchor="end">value →</text>
  <text class="t" x="20" y="385" font-size="17" >q-quantile = the value with a fraction q of the data below it</text>
  <text class="t" x="20" y="413" font-size="15" style="fill:#868e96">quartiles: 25 / 50 / 75%  ·  percentiles: 1 … 99%  ·  median = 50th percentile</text>
