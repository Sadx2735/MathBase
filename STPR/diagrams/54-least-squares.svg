<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="154" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <pattern id="hatch-red" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="1.7"/></pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#1971c2" stroke-width="1.7"/></pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2f9e44" stroke-width="1.7"/></pattern>
    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f08c00" stroke-width="1.7"/></pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#9c36b5" stroke-width="1.7"/></pattern>
    <pattern id="hatch-grey" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#adb5bd" stroke-width="1.7"/></pattern>

    <style>
      .t { font-family: Virgil, "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive; fill: #1e1e1e; }
    </style>
  </defs>
  <rect width="900" height="450" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="20" y="50" width="420" height="340" rx="16" fill="none" stroke="#ced4da" stroke-width="2"/>
    <line x1="85" y1="340" x2="338" y2="340" stroke="#1e1e1e" stroke-width="2"/>
    <path d="M328.1 344.8 L338 340 L328.1 335.2" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <line x1="90" y1="345" x2="90" y2="75" stroke="#1e1e1e" stroke-width="2"/>
    <path d="M94.8 84.9 L90 75 L85.2 84.9" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <rect x="276" y="112" width="38" height="38" rx="0" fill="url(#hatch-orange)" stroke="#f08c00" stroke-width="1.5"/>
    <line x1="276" y1="150" x2="276" y2="112" stroke="#e03131" stroke-width="2.5"/>
    <line x1="121.0" y1="302.0" x2="282.20000000000005" y2="104.4" stroke="#f08c00" stroke-width="3"/>
    <circle cx="152" cy="264" r="7" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="214" cy="188" r="7" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="276" cy="150" r="7" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <rect x="460" y="50" width="420" height="340" rx="16" fill="none" stroke="#ced4da" stroke-width="2"/>
    <line x1="525" y1="340" x2="778" y2="340" stroke="#1e1e1e" stroke-width="2"/>
    <path d="M768.1 344.8 L778 340 L768.1 335.2" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <line x1="530" y1="345" x2="530" y2="75" stroke="#1e1e1e" stroke-width="2"/>
    <path d="M534.8 84.9 L530 75 L525.2 84.9" stroke="#1e1e1e" stroke-width="2" fill="none"/>
    <rect x="592" y="257.6666666666667" width="6.333333333333314" height="6.333333333333314" rx="0" fill="url(#hatch-green)" stroke="#2f9e44" stroke-width="1.5"/>
    <line x1="592" y1="264" x2="592" y2="257.6666666666667" stroke="#e03131" stroke-width="2.5"/>
    <rect x="654" y="188" width="12.666666666666686" height="12.666666666666686" rx="0" fill="url(#hatch-green)" stroke="#2f9e44" stroke-width="1.5"/>
    <line x1="654" y1="188" x2="654" y2="200.66666666666669" stroke="#e03131" stroke-width="2.5"/>
    <rect x="716" y="143.66666666666666" width="6.333333333333343" height="6.333333333333343" rx="0" fill="url(#hatch-green)" stroke="#2f9e44" stroke-width="1.5"/>
    <line x1="716" y1="150" x2="716" y2="143.66666666666666" stroke="#e03131" stroke-width="2.5"/>
    <line x1="561.0" y1="286.1666666666667" x2="722.2" y2="137.96666666666664" stroke="#2f9e44" stroke-width="3"/>
    <circle cx="592" cy="264" r="7" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="654" cy="188" r="7" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <circle cx="716" cy="150" r="7" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  </g>

  <text class="t" x="20" y="32" font-size="20" >Least squares: the line whose squared misses add up to the least</text>
  <text class="t" x="230" y="78" font-size="17" text-anchor="middle" style="fill:#f08c00">guess: y = 2x</text>
  <text class="t" x="152" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">1</text>
  <text class="t" x="214" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">2</text>
  <text class="t" x="276" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">3</text>
  <text class="t" x="350" y="300" font-size="19" text-anchor="middle" style="fill:#f08c00">Σ d² = 1.00</text>
  <text class="t" x="670" y="78" font-size="17" text-anchor="middle" style="fill:#2f9e44">best: y = 1.5x + 0.67</text>
  <text class="t" x="592" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">1</text>
  <text class="t" x="654" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">2</text>
  <text class="t" x="716" y="360" font-size="13" text-anchor="middle" style="fill:#868e96">3</text>
  <text class="t" x="790" y="300" font-size="19" text-anchor="middle" style="fill:#2f9e44">Σ d² = 0.17</text>
  <text class="t" x="20" y="425" font-size="15" style="fill:#868e96">red = miss d (data − line) · shaded square = d² · the best line makes the total area smallest</text>
</svg>
