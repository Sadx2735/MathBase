  <text class="t" x="20" y="32" font-size="20" >Population = everyone. Sample = the few we actually check.</text>
  <text class="t" x="230" y="372" font-size="15" text-anchor="middle" style="fill:#868e96">population: all avocados sold in the US (size N)</text>
  <text class="t" x="462" y="168" font-size="13" text-anchor="middle" style="fill:#e03131">pick at random</text>
  <text class="t" x="590" y="300" font-size="15" text-anchor="middle" style="fill:#e03131">sample (size n = 8)</text>
  <text class="t" x="695" y="110" font-size="14" style="fill:#868e96">population has:</text>
  <text class="t" x="695" y="135.0" font-size="14" >μ (true mean)</text>
  <text class="t" x="695" y="154.6" font-size="14" >σ² (true variance)</text>
  <text class="t" x="695" y="174.2" font-size="14" >p (true proportion)</text>
  <text class="t" x="695" y="225" font-size="14" style="fill:#e03131">sample gives:</text>
  <text class="t" x="695" y="250.0" font-size="14" style="fill:#e03131">x̄ (sample mean)</text>
  <text class="t" x="695" y="269.6" font-size="14" style="fill:#e03131">s² (sample variance)</text>
  <text class="t" x="695" y="289.2" font-size="14" style="fill:#e03131">p̂ (sample proportion)</text>
  <text class="t" x="20" y="412" font-size="17" >we can't measure μ directly, so we use x̄ from the sample as our best guess</text>
</svg>
