  <text class="t" x="20" y="35" font-size="19">All the ways to get 2 heads in 5 flips</text>
  <text class="t" x="130" y="335" font-size="17" style="fill:#e03131">10 arrangements</text>
  <text class="t" x="470" y="80" font-size="17">If all 5 coins were different:</text>
  <text class="t" x="490" y="108" font-size="17" style="fill:#1971c2">5! = 120 orderings</text>
  <text class="t" x="470" y="148" font-size="17">But the 2 H's look identical</text>
  <text class="t" x="490" y="174" font-size="17" style="fill:#1971c2">→ divide by 2! = 2</text>
  <text class="t" x="470" y="212" font-size="17">and the 3 T's look identical</text>
  <text class="t" x="490" y="238" font-size="17" style="fill:#f08c00">→ divide by 3! = 6</text>
  <text class="t" x="470" y="290" font-size="18" style="fill:#e03131">C(5, 2) = 5! / (2! · 3!) = 120 / 12 = 10</text>
  <text class="t" x="470" y="340" font-size="16" style="fill:#868e96">each arrangement: (1/2)⁵ = 1/32</text>
  <text class="t" x="470" y="366" font-size="18">P(2 heads) = 10 × 1/32 = 10/32</text>
